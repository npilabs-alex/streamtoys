<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Pixel Art — Test</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; width:100vw; height:100vh; }

#world-canvas {
  position: fixed;
  aspect-ratio: 16/9;
  width: min(100vw, 100vh * 16 / 9);
  height: min(100vh, 100vw * 9 / 16);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: transparent;
}

#hud-top {
  position:fixed; top:0; left:0; right:0; z-index:10;
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 18px;
  background:linear-gradient(to bottom, rgba(0,0,0,0.65) 0%, transparent 100%);
  pointer-events:none;
}
#hud-room-label { color:#e8d098; font-size:14px; font-weight:bold; letter-spacing:3px; font-family:monospace; text-shadow:0 1px 4px rgba(0,0,0,0.8); }
#hud-npc-count  { color:rgba(160,160,210,0.85); font-size:11px; font-family:monospace; }

#hud-bottom {
  position:fixed; bottom:0; left:0; right:0; z-index:10;
  display:flex; justify-content:center; gap:10px;
  padding:12px 16px;
  background:linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
}
.room-btn {
  background:rgba(12,12,24,0.85); border:1px solid rgba(70,70,110,0.7);
  color:#8888b8; padding:7px 22px; cursor:pointer;
  font-family:monospace; font-size:12px; border-radius:3px;
  backdrop-filter:blur(6px);
}
.room-btn:hover  { background:rgba(28,28,52,0.9); color:#c0c0e0; }
.room-btn.active { background:rgba(170,90,15,0.92); color:#f0d060; border-color:rgba(210,140,30,0.9); font-weight:bold; }

#rotate-prompt {
  display:none; position:fixed; inset:0; z-index:9999;
  background:#000; flex-direction:column;
  align-items:center; justify-content:center; gap:16px;
  color:#e8d098; font-family:monospace; font-size:15px; text-align:center;
}
@media (orientation:portrait) and (pointer: coarse) { #rotate-prompt { display:flex; } }
</style>
</head>
<body>
<div id="rotate-prompt">
  <div style="font-size:52px">📱</div>
  <div>Rotate your device</div>
  <div style="font-size:11px; color:#6a6a9a; margin-top:4px">StreamToys World plays in landscape</div>
</div>
<canvas id="world-canvas" width="480" height="270"></canvas>
<canvas id="lighting-canvas" width="480" height="270"
  style="position:fixed; aspect-ratio:16/9;
         width:min(100vw, 100vh * 16 / 9);
         height:min(100vh, 100vw * 9 / 16);
         top:50%; left:50%;
         transform:translate(-50%, -50%);
         mix-blend-mode:multiply; pointer-events:none; z-index:4;
         image-rendering:pixelated;">
</canvas>
<canvas id="minimapCanvas" width="200" height="120"
  style="position:absolute; bottom:52px; right:8px;
         image-rendering:pixelated;
         pointer-events:none;
         z-index:10;">
</canvas>
<div id="hud-top">
  <span id="hud-room-label">LOUNGE</span>
  <span id="hud-npc-count">4 characters</span>
</div>
<div id="hud-bottom">
  <button class="room-btn active" id="room-btn-living"   onclick="setActiveRoom('living')">Living</button>
  <button class="room-btn"        id="room-btn-studio"   onclick="setActiveRoom('studio')">Studio</button>
  <button class="room-btn"        id="room-btn-gym"      onclick="setActiveRoom('gym')">Gym</button>
  <button class="room-btn"        id="room-btn-garden"   onclick="setActiveRoom('garden')">Garden</button>
  <button class="room-btn"        id="room-btn-bedroom"  onclick="setActiveRoom('bedroom')">Bedroom</button>
  <button class="room-btn"        id="room-btn-office"   onclick="setActiveRoom('office')">Office</button>
  <button class="room-btn"        id="room-btn-bathroom" onclick="setActiveRoom('bathroom')">Bathroom</button>
  <button class="room-btn"        id="room-btn-rooftop"  onclick="setActiveRoom('rooftop')">Rooftop</button>
  <button class="room-btn"        id="sky-toggle"        onclick="toggleSky()">SKY: AUTO</button>
</div>

<script>
// ── PALETTES ──────────────────────────────────────────────────────────────
const SKIN_TONES = [
  { name:'Fair',      base:'#f6dcb6', shade:'#dfa97a', dark:'#8f5a3c' },
  { name:'Light',     base:'#e8c098', shade:'#c08858', dark:'#6a4028' },
  { name:'Olive',     base:'#c8956a', shade:'#9a6840', dark:'#5a3818' },
  { name:'Tan',       base:'#a06840', shade:'#6a4020', dark:'#3a1808' },
  { name:'Brown',     base:'#7a4828', shade:'#4a2818', dark:'#1a0804' },
  { name:'Deep',      base:'#523018', shade:'#321808', dark:'#180a02' },
  // Fantasy / non-human tones (second row in the picker)
  { name:'Forest',    base:'#6aa850', shade:'#3a7028', dark:'#1a3810' },
  { name:'Ocean',     base:'#5878c8', shade:'#2a4878', dark:'#101a3a' },
  { name:'Gold',      base:'#e8c850', shade:'#a88828', dark:'#5a4818' },
  { name:'Lavender',  base:'#b890d8', shade:'#7858a0', dark:'#3a1858' },
  { name:'Ice',       base:'#a0d8e0', shade:'#5898a8', dark:'#1a4858' },
  { name:'Bubblegum', base:'#f098b8', shade:'#a86888', dark:'#582840' },
];

const HAIR_COLORS = [
  { name:'Black',  base:'#3a2412', shade:'#1a1008' },
  { name:'Brown',  base:'#7a4830', shade:'#4a2818' },
  { name:'Blonde', base:'#e8b860', shade:'#8a6018' },
  { name:'Red',    base:'#c83820', shade:'#681810' },
  { name:'Gray',   base:'#aaaaaa', shade:'#666666' },
  { name:'Mint',   base:'#80d0a8', shade:'#308050' },
  { name:'Purple', base:'#a050c0', shade:'#601080' },
  { name:'Pink',   base:'#f098c0', shade:'#a04068' },
];

const HAIR_STYLES = ['Short','Long','Bun','Mohawk','Afro','Pigtails','Engineer','Watch Cap','Top Hat','Slouchy','Trucker','Bald'];

const SHIRT_COLORS = [
  { name:'Navy',    base:'#3a5f95', shade:'#1a3868' },
  { name:'Crimson', base:'#9a2030', shade:'#5a0a18' },
  { name:'Forest',  base:'#2a8050', shade:'#103820' },
  { name:'Sun',     base:'#e8a020', shade:'#a86810' },
  { name:'Onyx',    base:'#2a2a30', shade:'#0a0a10' },
  { name:'Snow',    base:'#e8e8e8', shade:'#888888' },
  { name:'Violet',  base:'#8050d0', shade:'#401890' },
  { name:'Teal',    base:'#208a98', shade:'#084050' },
];

const PANTS_COLORS = [
  { name:'Indigo',  base:'#3a3868', shade:'#1a1838' },
  { name:'Black',   base:'#1a1a22', shade:'#000000' },
  { name:'Khaki',   base:'#a89060', shade:'#685a30' },
  { name:'Gray',    base:'#555560', shade:'#2a2a35' },
  { name:'Olive',   base:'#5a6028', shade:'#2a3010' },
];

const SHOE_COLORS = [
  { name:'Black',   base:'#1a1a22', shade:'#000000' },
  { name:'White',   base:'#e8e8e8', shade:'#888888' },
  { name:'Red',     base:'#c8202a', shade:'#681010' },
  { name:'Brown',   base:'#6a3818', shade:'#3a1808' },
];

const GLASSES_TYPES = ['None','Frames','Sunglasses','Round','Oversized','Cat-eye','Aviator'];
const GLASSES_COLORS = [
  { name:'Black',    base:'#1a0e1a' },   // matches OUTLINE (default)
  { name:'Gold',     base:'#c8a040' },
  { name:'Silver',   base:'#a0a0a8' },
  { name:'Red',      base:'#a83020' },
  { name:'Blue',     base:'#3050a8' },
  { name:'Tortoise', base:'#5a3818' },
  { name:'Clear',    base:'#b0b0b8' },
];
const BEARD_TYPES   = ['Clean','Stubble','Goatee','Full'];
const TOP_STYLES    = ['Shirt','Tank','Dress'];
const BOT_STYLES    = ['Pants','Shorts','Bare'];

// Beards get their own color (rather than inheriting hair)
const BEARD_COLORS = [
  { name:'Black',  base:'#3a2412', shade:'#1a1008' },
  { name:'Brown',  base:'#7a4830', shade:'#4a2818' },
  { name:'Blonde', base:'#c8956a', shade:'#8a6018' },
  { name:'Red',    base:'#a83820', shade:'#681810' },
  { name:'Gray',   base:'#aaaaaa', shade:'#666666' },
  { name:'White',  base:'#e8e8e8', shade:'#888888' },
];

const HAT_COLORS = [
  { name:'Onyx',   base:'#2a2a2a', shade:'#0a0a0a' },
  { name:'Navy',   base:'#1a3a6a', shade:'#0a1a3a' },
  { name:'Forest', base:'#2a5a3a', shade:'#0a2a1a' },
  { name:'Rust',   base:'#8a4a2a', shade:'#4a2a1a' },
  { name:'Stone',  base:'#6a6a5a', shade:'#3a3a2a' },
  { name:'Cream',  base:'#d8d0c0', shade:'#a89888' },
];

const EYE_COLORS = [
  { name:'Brown', base:'#5a3818', shade:'#3a2010' },
  { name:'Blue',  base:'#3070b8', shade:'#103060' },
  { name:'Green', base:'#308050', shade:'#103020' },
  { name:'Hazel', base:'#7a5828', shade:'#3a2810' },
  { name:'Gray',  base:'#888888', shade:'#444444' },
  { name:'Amber', base:'#c89028', shade:'#8a5018' },
];

const OUTLINE = '#1a0e1a';

// Extra rows above chibi y=0 so tall hats (Top Hat, Mohawk, etc. drawing to y=-4)
// + the 1px walk bob aren't clipped by tight 24×32 canvases.
const CHIBI_HEAD_ROOM = 9;

// Scale helper for 36×48 native redraw: converts original 24×32 coordinates to 1.5× size
const _cp = n => Math.round(n * 1.5);

// ── DRAW HELPERS ──────────────────────────────────────────────────────────
function px(ctx,x,y,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,_cp(1),_cp(1)); }
function rect(ctx,x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }

// ── CHARACTER (Gather projection: 36×48 native, chibi proportions, ~15° top-down) ──
function drawChar(ctx, opts={}, frame=0) {
  ctx.clearRect(0, 0, _cp(36), _cp(48) + CHIBI_HEAD_ROOM);
  ctx.save();
  ctx.translate(0, CHIBI_HEAD_ROOM);

  // ─── FACING DISPATCH ─── (S = default front; E = right profile; W = mirrored E; N = back)
  const facing = opts.facing || 'S';
  if (facing === 'N') {
    drawCharN_inner(ctx, opts, frame);
    ctx.restore();
    return;
  }
  if (facing === 'E' || facing === 'W') {
    if (facing === 'W') { ctx.translate(36, 0); ctx.scale(-1, 1); }
    drawCharE_inner(ctx, opts, frame);
    ctx.restore();
    return;
  }

  const O = OUTLINE;
  const skin = opts.skin || SKIN_TONES[2];
  const hair = opts.hair || HAIR_COLORS[1];
  const shirt = opts.shirt || SHIRT_COLORS[0];
  const pants = opts.pants || PANTS_COLORS[0];
  const shoes = opts.shoes || SHOE_COLORS[0];
  const hairStyle = opts.hairStyle ?? 0;
  const glasses = opts.glasses ?? 0;
  const beard = opts.beard ?? 0;
  const beardCol = opts.beardCol || BEARD_COLORS[1];
  const eye = opts.eye || EYE_COLORS[0];
  // ─── WALK FRAME ───
  // frame 0,2: neutral. frame 1,3: body bobs up 1px + one foot lifts.
  const bob = (frame === 1 || frame === 3) ? _cp(-1) : 0;
  const lFootDy = frame === 1 ? _cp(-1) : 0;
  const rFootDy = frame === 3 ? _cp(-1) : 0;
  ctx.save();
  ctx.translate(0, bob);

  // ─── HEAD (rounded chibi oval, ~44% height) ─── x=4..19, y=1..14
  rect(ctx,_cp(4),_cp(1),_cp(16),_cp(14),skin.base);
  rect(ctx,_cp(15),_cp(5),_cp(4),_cp(8),skin.shade);    // right cheek shade
  // Round 2px corners (cut top + bottom)
  px(ctx,_cp(4),_cp(1),O); px(ctx,_cp(5),_cp(1),O); px(ctx,_cp(18),_cp(1),O); px(ctx,_cp(19),_cp(1),O);
  px(ctx,_cp(4),_cp(2),O); px(ctx,_cp(19),_cp(2),O);
  px(ctx,_cp(4),_cp(13),O); px(ctx,_cp(19),_cp(13),O);
  px(ctx,_cp(4),_cp(14),O); px(ctx,_cp(5),_cp(14),O); px(ctx,_cp(18),_cp(14),O); px(ctx,_cp(19),_cp(14),O);
  // Side outlines
  rect(ctx,_cp(3),_cp(3),_cp(1),_cp(10),O); rect(ctx,_cp(20),_cp(3),_cp(1),_cp(10),O);
  // Dome top + chin
  rect(ctx,_cp(6),_cp(0),_cp(12),_cp(1),O);
  rect(ctx,_cp(6),_cp(15),_cp(12),_cp(1),O);

  // Ears
  px(ctx,_cp(3),_cp(8),skin.base); px(ctx,_cp(3),_cp(9),skin.shade);
  px(ctx,_cp(20),_cp(8),skin.shade); px(ctx,_cp(20),_cp(9),skin.dark);
  px(ctx,_cp(2),_cp(8),O); px(ctx,_cp(2),_cp(9),O);
  px(ctx,_cp(21),_cp(8),O); px(ctx,_cp(21),_cp(9),O);

  // Eyes (chibi 2×3 — outline + colored iris + white sparkle)
  rect(ctx,_cp(7),_cp(8),_cp(2),_cp(3),O);
  rect(ctx,_cp(14),_cp(8),_cp(2),_cp(3),O);
  // Iris (middle row of each eye)
  rect(ctx,_cp(7),_cp(9),_cp(2),_cp(1),eye.base);
  rect(ctx,_cp(14),_cp(9),_cp(2),_cp(1),eye.base);
  // Sparkle (top-left pixel of each pupil)
  px(ctx,_cp(8),_cp(8),'#ffffff'); px(ctx,_cp(15),_cp(8),'#ffffff');
  // Bottom shadow of iris
  px(ctx,_cp(7),_cp(10),eye.shade);
  px(ctx,_cp(14),_cp(10),eye.shade);
  // Eye-line shadow above
  rect(ctx,_cp(7),_cp(7),_cp(2),_cp(1),skin.dark);
  rect(ctx,_cp(14),_cp(7),_cp(2),_cp(1),skin.dark);

  // Nose
  px(ctx,_cp(11),_cp(11),skin.shade); px(ctx,_cp(12),_cp(11),skin.shade);

  // Mouth
  rect(ctx,_cp(10),_cp(13),_cp(4),_cp(1),O);
  px(ctx,_cp(11),_cp(14),skin.shade); px(ctx,_cp(12),_cp(14),skin.shade);

  // ─── BEARD (drawn over chin before hair, uses dedicated beard color) ───
  if (beard > 0) {
    const bc = beardCol.base;
    if (beard === 1) {  // Stubble
      px(ctx,_cp(8),_cp(13),bc);  px(ctx,_cp(15),_cp(13),bc);
      px(ctx,_cp(9),_cp(14),bc);  px(ctx,_cp(11),_cp(14),bc); px(ctx,_cp(12),_cp(14),bc); px(ctx,_cp(14),_cp(14),bc);
      px(ctx,_cp(10),_cp(12),bc); px(ctx,_cp(13),_cp(12),bc);
    } else if (beard === 2) {  // Goatee
      rect(ctx,_cp(10),_cp(14),_cp(4),_cp(1),bc);
      px(ctx,_cp(11),_cp(12),bc); px(ctx,_cp(12),_cp(12),bc);
      rect(ctx,_cp(10),_cp(13),_cp(4),_cp(1),O); // re-darken mouth
    } else if (beard === 3) {  // Full
      // mustache
      rect(ctx,_cp(8),_cp(12),_cp(8),_cp(1),bc);
      px(ctx,_cp(7),_cp(12),bc); px(ctx,_cp(16),_cp(12),bc);
      // chin + jaw
      rect(ctx,_cp(7),_cp(13),_cp(10),_cp(1),bc);
      rect(ctx,_cp(6),_cp(14),_cp(12),_cp(1),bc);
      // re-darken mouth
      rect(ctx,_cp(10),_cp(13),_cp(4),_cp(1),O);
      // Edges/outline
      rect(ctx,_cp(6),_cp(15),_cp(12),_cp(1),O);
    }
  }

  // ─── HAIR / HAT ───
  if (hairStyle <= 5) {
    const H = hair.base, HS = hair.shade;
    if (hairStyle === 0) {  // Short
      rect(ctx,_cp(6),_cp(1),_cp(12),_cp(1),H);
      rect(ctx,_cp(5),_cp(2),_cp(14),_cp(1),H);
      rect(ctx,_cp(4),_cp(3),_cp(16),_cp(3),H);
      rect(ctx,_cp(4),_cp(5),_cp(16),_cp(1),HS);
      px(ctx,_cp(3),_cp(3),H); px(ctx,_cp(3),_cp(4),HS); px(ctx,_cp(3),_cp(5),HS);
      px(ctx,_cp(20),_cp(3),H); px(ctx,_cp(20),_cp(4),HS); px(ctx,_cp(20),_cp(5),HS);
      // Side-part dark line
      px(ctx,_cp(8),_cp(1),HS); px(ctx,_cp(8),_cp(2),HS);
      // Bangs wisps
      px(ctx,_cp(7),_cp(6),HS); px(ctx,_cp(11),_cp(6),HS); px(ctx,_cp(16),_cp(6),HS);
    } else if (hairStyle === 1) {  // Long
      rect(ctx,_cp(6),_cp(1),_cp(12),_cp(1),H);
      rect(ctx,_cp(5),_cp(2),_cp(14),_cp(1),H);
      rect(ctx,_cp(4),_cp(3),_cp(16),_cp(4),H);
      // Long flowing sides extending below ear
      rect(ctx,_cp(3),_cp(5),_cp(1),_cp(11),H);
      rect(ctx,_cp(20),_cp(5),_cp(1),_cp(11),H);
      // Bangs
      rect(ctx,_cp(4),_cp(6),_cp(16),_cp(1),HS);
      // Outer outline of long hair sides
      rect(ctx,_cp(2),_cp(5),_cp(1),_cp(11),O);
      rect(ctx,_cp(21),_cp(5),_cp(1),_cp(11),O);
      px(ctx,_cp(3),_cp(16),O); px(ctx,_cp(20),_cp(16),O);
      // Texture stripes
      px(ctx,_cp(4),_cp(9),HS); px(ctx,_cp(4),_cp(12),HS);
      px(ctx,_cp(19),_cp(9),HS); px(ctx,_cp(19),_cp(12),HS);
    } else if (hairStyle === 2) {  // Bun
      rect(ctx,_cp(6),_cp(1),_cp(12),_cp(1),H);
      rect(ctx,_cp(5),_cp(2),_cp(14),_cp(1),H);
      rect(ctx,_cp(4),_cp(3),_cp(16),_cp(3),H);
      rect(ctx,_cp(4),_cp(5),_cp(16),_cp(1),HS);
      px(ctx,_cp(3),_cp(3),H); px(ctx,_cp(3),_cp(4),HS); px(ctx,_cp(3),_cp(5),HS);
      px(ctx,_cp(20),_cp(3),H); px(ctx,_cp(20),_cp(4),HS); px(ctx,_cp(20),_cp(5),HS);
      // Bun on top
      rect(ctx,_cp(9),_cp(-2),_cp(6),_cp(4),H);
      rect(ctx,_cp(10),_cp(-3),_cp(4),_cp(1),H);
      rect(ctx,_cp(9),_cp(1),_cp(6),_cp(1),HS);
      // Tie / band
      px(ctx,_cp(11),_cp(-1),HS); px(ctx,_cp(12),_cp(-1),HS);
      // Bun outline
      rect(ctx,_cp(10),_cp(-4),_cp(4),_cp(1),O);
      px(ctx,_cp(9),_cp(-3),O); px(ctx,_cp(14),_cp(-3),O);
      rect(ctx,_cp(8),_cp(-2),_cp(1),_cp(4),O); rect(ctx,_cp(15),_cp(-2),_cp(1),_cp(4),O);
      rect(ctx,_cp(9),_cp(2),_cp(6),_cp(1),O);
    } else if (hairStyle === 3) {  // Mohawk
      rect(ctx,_cp(10),_cp(-3),_cp(4),_cp(9),H);
      rect(ctx,_cp(10),_cp(-3),_cp(4),_cp(1),HS);
      rect(ctx,_cp(11),_cp(-2),_cp(2),_cp(7),HS);
      rect(ctx,_cp(9),_cp(-2),_cp(1),_cp(8),O); rect(ctx,_cp(14),_cp(-2),_cp(1),_cp(8),O);
      rect(ctx,_cp(10),_cp(-4),_cp(4),_cp(1),O);
      // Shaved sides texture
      px(ctx,_cp(7),_cp(3),skin.dark); px(ctx,_cp(16),_cp(3),skin.dark);
      px(ctx,_cp(7),_cp(4),skin.dark); px(ctx,_cp(16),_cp(4),skin.dark);
    } else if (hairStyle === 4) {  // Afro — round halo extending past head
      rect(ctx,_cp(8),_cp(-1),_cp(8),_cp(1),H);
      rect(ctx,_cp(5),_cp(0),_cp(14),_cp(1),H);
      rect(ctx,_cp(3),_cp(1),_cp(18),_cp(4),H);
      rect(ctx,_cp(4),_cp(5),_cp(16),_cp(1),H);
      rect(ctx,_cp(5),_cp(6),_cp(14),_cp(1),HS);
      // Curl texture dots
      px(ctx,_cp(5),_cp(2),HS);  px(ctx,_cp(10),_cp(1),HS); px(ctx,_cp(15),_cp(2),HS); px(ctx,_cp(18),_cp(3),HS);
      px(ctx,_cp(7),_cp(4),HS);  px(ctx,_cp(12),_cp(4),HS); px(ctx,_cp(17),_cp(4),HS);
      px(ctx,_cp(8),_cp(0),HS);  px(ctx,_cp(13),_cp(0),HS);
      // Outline (irregular round)
      rect(ctx,_cp(8),_cp(-2),_cp(8),_cp(1),O);
      px(ctx,_cp(7),_cp(-1),O); px(ctx,_cp(16),_cp(-1),O);
      px(ctx,_cp(5),_cp(-1),O); px(ctx,_cp(18),_cp(-1),O);
      px(ctx,_cp(4),_cp(0),O); px(ctx,_cp(19),_cp(0),O);
      rect(ctx,_cp(2),_cp(1),_cp(1),_cp(4),O); rect(ctx,_cp(21),_cp(1),_cp(1),_cp(4),O);
      px(ctx,_cp(3),_cp(5),O); px(ctx,_cp(20),_cp(5),O);
      px(ctx,_cp(4),_cp(6),O); px(ctx,_cp(19),_cp(6),O);
      px(ctx,_cp(5),_cp(7),O); px(ctx,_cp(18),_cp(7),O);

// ── ISO FLOOR TILES ───────────────────────────────────────────────────────
function drawTile(ctx, type) {
  // 32×16 isometric diamond
  ctx.clearRect(0,0,32,16);
  const palettes = {
    wood:    { a:'#a87038', b:'#7a4818', edge:'#3a1c10', grain:'#642a08' },
    carpet:  { a:'#80305a', b:'#5a1a3a', edge:'#2a0820', grain:'#400828' },
    tile:    { a:'#a8b0c0', b:'#7080a0', edge:'#303848', grain:'#88a0b0' },
    grass:   { a:'#3a8038', b:'#205820', edge:'#102a0a', grain:'#50a040' },
  };
  const p = palettes[type] || palettes.wood;
  // Draw diamond
  // For each row, draw a span
  // Top point at (15.5, 0), goes down to width 32 at y=8, then back to point at y=15
  for(let y=0; y<8; y++) {
    const xStart = 15 - y*2;
    const xEnd = 16 + y*2;
    rect(ctx, xStart, y, xEnd-xStart+1, _cp(1), y < 4 ? p.a : p.b);
  }
  for(let y=8; y<16; y++) {
    const k = 15 - y;
    const xStart = 15 - (k+7)*2;
    const xEnd = 16 + (k+7)*2;
    // wait this is wrong. let me recompute
  }
  // Redo: diamond
  ctx.clearRect(0,0,32,16);
  for(let y=0; y<8; y++) {
    const half = y*2 + _cp(1);
    const xStart = 16 - half;
    const w = half*2;
    rect(ctx, xStart, y, w, _cp(1), y<4 ? p.a : p.b);
  }
  for(let y=8; y<16; y++) {
    const half = (15-y)*2 + _cp(1);
    const xStart = 16 - half;
    const w = half*2;
    rect(ctx, xStart, y, w, _cp(1), p.b);
  }
  // Highlight stripe
  if (type === 'wood') {
    for(let y=2; y<6; y++) { px(ctx, 16+y, y, p.grain); }
  } else if (type === 'tile') {
    // grid pattern via diagonal
    px(ctx,16,7,p.edge);
    px(ctx,15,8,p.edge); px(ctx,16,8,p.edge);
  } else if (type === 'grass') {
    px(ctx,12,5,p.grain); px(ctx,20,6,p.grain);
    px(ctx,14,8,p.grain); px(ctx,18,9,p.grain);
  } else if (type === 'carpet') {
    px(ctx,14,5,p.grain); px(ctx,18,5,p.grain);
    px(ctx,15,8,p.grain); px(ctx,17,8,p.grain);
  }
  // Edge outline (diamond)
  // Top edges
  for(let y=0; y<8; y++) {
    const half = y*2 + _cp(1);
    px(ctx, 16 - half, y, p.edge);
    px(ctx, 16 + half - _cp(1), y, p.edge);
  }
  for(let y=8; y<16; y++) {
    const half = (15-y)*2 + _cp(1);
    px(ctx, 16 - half, y, p.edge);
    px(ctx, 16 + half - _cp(1), y, p.edge);
  }
}

// ── TINY GATHER-STYLE SCENE (top-down) ──────────────────────────────────
function drawEllipse(ctx, cx, cy, rx, ry, color) {
  for (let dy = -ry; dy <= ry; dy++) {
    const t = (dy * dy) / (ry * ry + 0.0001);
    if (t >= 1) continue;
    const dx = Math.floor(rx * Math.sqrt(1 - t));
    rect(ctx, cx - dx, cy + dy, dx * 2 + _cp(1), _cp(1), color);
  }
}

function drawTinyTile(ctx, x, y, w, h, base, shade) {

  rect(ctx, x, y + h - _cp(1), w, _cp(1), shade);

// ── RECORD SHELF (TALL object — front face dominant, contents visible) ──
function drawTinyRecordShelf(ctx, x, y) {
  // 30w × 40h shelf with 4 levels of vinyl + a turntable
  const wood = '#5a3818', woodH = '#7a4828', woodS = '#3a2010', woodD = '#1a0a04';
  // Shelf body
  rect(ctx, x, y, 30, 40, wood);
  rect(ctx, x, y, 30, _cp(1), woodH);          // top edge
  rect(ctx, x, y + 39, 30, _cp(1), woodS);
  // Side panels
  rect(ctx, x, y, _cp(1), 40, woodS);
  rect(ctx, x + 29, y, _cp(1), 40, woodS);
  // Shelf dividers
  rect(ctx, x + _cp(1), y + 8, 28, _cp(1), woodD);
  rect(ctx, x + _cp(1), y + 17, 28, _cp(1), woodD);
  rect(ctx, x + _cp(1), y + 27, 28, _cp(1), woodD);

  // SHELF 1 — vinyl LPs standing up (full row of records)
  const lpColors1 = ['#d83020','#208090','#a83820','#e8a040','#3050c0','#308050','#202020','#a050c0','#e8e8e8'];
  for (let i = 0; i < 9; i++) {

  // SHELF 2 — partial row + a record sleeve laying flat
  rect(ctx, x + 2, y + 11, 2, 5, '#e8a040');
  rect(ctx, x + 5, y + 11, 2, 5, '#3050c0');
  rect(ctx, x + 8, y + 11, 2, 5, '#d83020');

  rect(ctx, x + 13, y + 12, 14, 4, '#1a1a22');
  rect(ctx, x + 14, y + 13, 12, 2, '#e83098');
  drawEllipse(ctx, x + 20, y + 14, 3, _cp(1), '#000');

  // SHELF 3 — turntable (front view — you see the platter + tonearm)
  rect(ctx, x + 2, y + 19, 26, 8, '#1a1a22');
  rect(ctx, x + 2, y + 19, 26, _cp(1), '#2a2a32');     // top edge
  // Platter (large dark circle from front-angled view = oval)
  drawEllipse(ctx, x + 12, y + 23, 8, 3, '#000');
  drawEllipse(ctx, x + 12, y + 23, 7, 2, '#0a0a10');
  px(ctx, x + 12, y + 23, '#e83020');             // center label
  // Tonearm (visible going across platter)
  rect(ctx, x + 17, y + 21, 6, _cp(1), '#888');
  px(ctx, x + 23, y + 21, '#e83020');             // counterweight
  // Speed switches
  px(ctx, x + 4, y + 24, '#e8a040'); px(ctx, x + 4, y + 25, '#e8a040');
  px(ctx, x + 6, y + 24, '#30d030'); px(ctx, x + 6, y + 25, '#30d030');

  // SHELF 4 — more LPs (bottom)

    rect(ctx, x + 2 + i * 4, y + 30, 3, 8, lpColors2[i]);
    rect(ctx, x + 2 + i * 4, y + 30, 3, _cp(1), '#1a0a04');

  // Overall outline
  rect(ctx, x, y - _cp(1), 30, _cp(1), '#1a0a04');
  rect(ctx, x - _cp(1), y, _cp(1), 41, '#1a0a04');
  rect(ctx, x + 30, y, _cp(1), 41, '#1a0a04');
  rect(ctx, x, y + 40, 30, _cp(1), '#1a0a04');
}

function drawTinyChar(ctx, opts, scale, frame) {
  // Default-frame fallback: in-scene NPCs animate from the module-level currentFrame
  const f = frame ?? currentFrame;
  const off = document.createElement('canvas');
  off.width = 36; off.height = 48 + CHIBI_HEAD_ROOM;
  drawChar(off.getContext('2d'), opts, f);
  ctx.imageSmoothingEnabled = false;
  // Offset destination up by CHIBI_HEAD_ROOM so caller's translate still anchors the chibi feet
  // at the same scene position — extra hat headroom extends ABOVE the anchor point.
  ctx.drawImage(off, 0, 0, 36, 48 + CHIBI_HEAD_ROOM,
                0, -CHIBI_HEAD_ROOM * scale,
                36 * scale, (48 + CHIBI_HEAD_ROOM) * scale);
}

function dropShadow(ctx, cx, cy, rx, ry) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// PETS — dogs & cats
// ══════════════════════════════════════════════════════════════════════════
const PET_COLORS = [
  { name:'Brown',  base:'#a87038', shade:'#704818', light:'#c89048' },
  { name:'Black',  base:'#2a2222', shade:'#0a0a0a', light:'#4a4242' },
  { name:'White',  base:'#e8dccc', shade:'#aa9988', light:'#ffffff' },
  { name:'Gray',   base:'#888888', shade:'#555555', light:'#aaaaaa' },
  { name:'Orange', base:'#d88838', shade:'#a05818', light:'#e8a050' },
  { name:'Cream',  base:'#e8c898', shade:'#a89058', light:'#f8e8c0' },
];
const PET_SPECIES  = ['Dog','Cat'];
const PET_PATTERNS = ['Solid','Spotted','Tuxedo'];
const COLLAR_COLORS = [
  { name:'None',   base:null    },
  { name:'Red',    base:'#d83020' },
  { name:'Blue',   base:'#3050c0' },
  { name:'Green',  base:'#308050' },
  { name:'Yellow', base:'#e8c020' },
  { name:'Pink',   base:'#e878a8' },
];

function drawDog(ctx, opts={}) {
  ctx.clearRect(0, 0, 24, 20);
  const O = '#1a0e1a';
  const body = opts.body || PET_COLORS[0];
  const eyeC = opts.eye || EYE_COLORS[0];
  const collarC = opts.collar;
  const pattern = opts.pattern ?? 0;
  // Floppy ears
  rect(ctx, 3, 4, 3, 5, body.base);
  rect(ctx, 3, 4, 3, _cp(1), body.shade);
  rect(ctx, 18, 4, 3, 5, body.shade);
  rect(ctx, 2, 4, _cp(1), 5, O); rect(ctx, 6, 4, _cp(1), 5, O);
  rect(ctx, 17, 4, _cp(1), 5, O); rect(ctx, 21, 4, _cp(1), 5, O);
  rect(ctx, 3, 9, 3, _cp(1), O); rect(ctx, 18, 9, 3, _cp(1), O);
  rect(ctx, 3, 3, 3, _cp(1), O); rect(ctx, 18, 3, 3, _cp(1), O);
  // Head
  rect(ctx, 6, 4, 12, 9, body.base);
  if (pattern === 1) {
    rect(ctx, 7, 5, 2, 2, body.shade);
    rect(ctx, 14, 7, 2, 2, body.shade);
  } else if (pattern === 2) {
    rect(ctx, 9, 9, 6, 4, body.light);
  }
  rect(ctx, 5, 5, _cp(1), 8, O); rect(ctx, 18, 5, _cp(1), 8, O);
  rect(ctx, 6, 4, 12, _cp(1), O); rect(ctx, 6, 13, 12, _cp(1), O);
  px(ctx, 5, 4, O); px(ctx, 18, 4, O);
  // Eyes
  rect(ctx, 8, 7, 2, 2, O); rect(ctx, 14, 7, 2, 2, O);
  px(ctx, 9, 8, eyeC.base); px(ctx, 15, 8, eyeC.base);
  px(ctx, 8, 7, '#ffffff'); px(ctx, 14, 7, '#ffffff');
  // Nose
  rect(ctx, 11, 10, 2, 2, O);
  px(ctx, 11, 10, '#3a2010');
  // Mouth
  px(ctx, 10, 12, O); px(ctx, 11, 12, O); px(ctx, 12, 12, O); px(ctx, 13, 12, O);
  px(ctx, 11, 13, '#e89098');
  // Body (sitting, chest wider than head)
  rect(ctx, 5, 13, 14, 5, body.base);
  if (pattern === 1) {
    rect(ctx, 6, 14, 2, 2, body.shade);
    rect(ctx, 14, 15, 3, 2, body.shade);
  } else if (pattern === 2) {
    rect(ctx, 8, 14, 8, 4, body.light);
  }
  rect(ctx, 15, 14, 3, 4, body.shade);
  rect(ctx, 4, 13, _cp(1), 5, O); rect(ctx, 19, 13, _cp(1), 5, O);
  // Front paws
  rect(ctx, 6, 17, 3, 2, body.base);
  rect(ctx, 15, 17, 3, 2, body.base);
  rect(ctx, 6, 18, 3, _cp(1), body.shade); rect(ctx, 15, 18, 3, _cp(1), body.shade);
  rect(ctx, 5, 17, _cp(1), 2, O); rect(ctx, 9, 17, _cp(1), 2, O);
  rect(ctx, 14, 17, _cp(1), 2, O); rect(ctx, 18, 17, _cp(1), 2, O);
  rect(ctx, 6, 19, 3, _cp(1), O); rect(ctx, 15, 19, 3, _cp(1), O);
  px(ctx, 7, 18, O); px(ctx, 16, 18, O);
  // Tail (wagging up-right)
  rect(ctx, 19, 9, 2, 4, body.base);
  rect(ctx, 20, 7, _cp(1), 3, body.base);
  rect(ctx, 19, 8, 2, _cp(1), body.shade);
  rect(ctx, 21, 7, _cp(1), 3, O); rect(ctx, 19, 7, 2, _cp(1), O);
  rect(ctx, 19, 13, 2, _cp(1), O); px(ctx, 20, 6, O);
  // Collar
  if (collarC && collarC.base) {
    rect(ctx, 6, 13, 12, _cp(1), collarC.base);
    px(ctx, 11, 14, '#c8a040');
  }
}

function drawCat(ctx, opts={}) {
  ctx.clearRect(0, 0, 24, 20);
  const O = '#1a0e1a';

  const eyeC = opts.eye || EYE_COLORS[2];

  // Pointy ears (triangles)
  px(ctx, 6, _cp(1), body.base);
  rect(ctx, 5, 2, 3, _cp(1), body.base);
  rect(ctx, 4, 3, 4, _cp(1), body.base);
  px(ctx, 17, _cp(1), body.base);
  rect(ctx, 16, 2, 3, _cp(1), body.base);
  rect(ctx, 16, 3, 4, _cp(1), body.base);
  px(ctx, 6, 2, '#e89098'); px(ctx, 17, 2, '#e89098');
  px(ctx, 5, _cp(1), O); px(ctx, 7, _cp(1), O);
  px(ctx, 4, 2, O); px(ctx, 8, 2, O);
  px(ctx, 3, 3, O);
  px(ctx, 16, _cp(1), O); px(ctx, 18, _cp(1), O);
  px(ctx, 15, 2, O); px(ctx, 19, 2, O);
  px(ctx, 20, 3, O);
  // Head
  rect(ctx, 6, 4, 12, 9, body.base);
  if (pattern === 1) {
    rect(ctx, 8, 5, _cp(1), 2, body.shade);
    rect(ctx, 10, 5, _cp(1), 2, body.shade);
    rect(ctx, 12, 5, _cp(1), 2, body.shade);
    rect(ctx, 14, 5, _cp(1), 2, body.shade);
  } else if (pattern === 2) {

  rect(ctx, 5, 5, _cp(1), 8, O); rect(ctx, 18, 5, _cp(1), 8, O);
  rect(ctx, 6, 4, 12, _cp(1), O); rect(ctx, 6, 13, 12, _cp(1), O);
  px(ctx, 5, 4, O); px(ctx, 18, 4, O);
  // Large almond eyes
  rect(ctx, 7, 6, 3, 3, O); rect(ctx, 14, 6, 3, 3, O);
  rect(ctx, 8, 7, _cp(1), 2, eyeC.base);
  rect(ctx, 15, 7, _cp(1), 2, eyeC.base);
  px(ctx, 8, 7, '#ffffff'); px(ctx, 15, 7, '#ffffff');
  px(ctx, 8, 8, eyeC.shade); px(ctx, 15, 8, eyeC.shade);
  // Pink nose
  rect(ctx, 11, 10, 2, _cp(1), '#e89098');
  px(ctx, 12, 11, '#aa6878');
  // Mouth (W)
  px(ctx, 10, 11, O); px(ctx, 13, 11, O);
  px(ctx, 11, 12, O); px(ctx, 12, 12, O);
  // Whiskers
  px(ctx, 3, 9, '#dddddd'); px(ctx, 4, 10, '#dddddd');
  px(ctx, 20, 9, '#dddddd'); px(ctx, 19, 10, '#dddddd');
  // Sleek body
  rect(ctx, 6, 13, 12, 5, body.base);
  if (pattern === 1) {
    rect(ctx, 8, 14, _cp(1), 4, body.shade);
    rect(ctx, 11, 14, _cp(1), 4, body.shade);
    rect(ctx, 14, 14, _cp(1), 4, body.shade);
  } else if (pattern === 2) {
    rect(ctx, 7, 14, 10, 4, body.light);
  }
  rect(ctx, 14, 14, 4, 4, body.shade);
  rect(ctx, 5, 13, _cp(1), 5, O); rect(ctx, 18, 13, _cp(1), 5, O);
  // Front paws
  rect(ctx, 7, 17, 3, 2, body.base);
  rect(ctx, 14, 17, 3, 2, body.base);
  rect(ctx, 7, 18, 3, _cp(1), body.shade); rect(ctx, 14, 18, 3, _cp(1), body.shade);
  rect(ctx, 6, 17, _cp(1), 2, O); rect(ctx, 10, 17, _cp(1), 2, O);
  rect(ctx, 13, 17, _cp(1), 2, O); rect(ctx, 17, 17, _cp(1), 2, O);
  rect(ctx, 7, 19, 3, _cp(1), O); rect(ctx, 14, 19, 3, _cp(1), O);
  // Curled tail (right side, curling up)
  rect(ctx, 19, 14, _cp(1), 3, body.base);
  rect(ctx, 20, 12, _cp(1), 3, body.base);
  rect(ctx, 21, 10, _cp(1), 3, body.base);
  rect(ctx, 22, 9, _cp(1), 3, body.base);
  rect(ctx, 22, 8, _cp(1), _cp(1), body.shade);
  // Tail outlines
  rect(ctx, 19, 13, _cp(1), _cp(1), O); rect(ctx, 20, 11, _cp(1), _cp(1), O);
  rect(ctx, 21, 9, _cp(1), _cp(1), O); rect(ctx, 22, 7, 2, _cp(1), O);
  rect(ctx, 19, 17, _cp(1), _cp(1), O); rect(ctx, 20, 15, _cp(1), _cp(1), O);
  rect(ctx, 21, 13, _cp(1), _cp(1), O); rect(ctx, 23, 9, _cp(1), 4, O);
  // Collar
  if (collarC && collarC.base) {
    rect(ctx, 6, 13, 12, _cp(1), collarC.base);
    px(ctx, 11, 14, '#c8a040');
  }
}

function drawPet(ctx, opts) {
  if ((opts.species ?? 0) === 1) drawCat(ctx, opts);
  else drawDog(ctx, opts);
}

const pet = { species: 0, body: 0, pattern: 0, eye: 0, collar: 1 };

function petParams() {
  return {
    species: pet.species,
    body: PET_COLORS[pet.body],
    pattern: pet.pattern,
    eye: EYE_COLORS[pet.eye],
    collar: COLLAR_COLORS[pet.collar],
  };
}

function refreshPet() {
  const cv = document.getElementById('pet');
  if (!cv) return;
  drawPet(cv.getContext('2d'), petParams());
  document.getElementById('pet-name').textContent =
    `${PET_COLORS[pet.body].name} ${PET_PATTERNS[pet.pattern]} ${PET_SPECIES[pet.species]}` +
    (COLLAR_COLORS[pet.collar].base ? ` · ${COLLAR_COLORS[pet.collar].name} collar` : '');
}

function buildPetControls() {
  const c = document.getElementById('pet-controls');
  if (!c) return;
  c.innerHTML = '';
  function petGroup(label, items, currentIdx, onPick, colorPicker=true) {
    const wrap = document.createElement('div'); wrap.className='ctrl';
    const n = document.createElement('div'); n.className='ctrl-name'; n.textContent=label;
    wrap.appendChild(n);
    const sw = document.createElement('div'); sw.className = colorPicker ? 'swatches' : 'style-btns';
    items.forEach((it,i)=>{
      const e = document.createElement('div');
      if (colorPicker) {
        e.className = 'swatch' + (i===currentIdx?' active':'');
        e.style.background = it.base || 'transparent';
        if (!it.base) { e.style.background = 'rgba(0,0,0,0.3)'; e.style.border = '2px dashed rgba(255,255,255,0.3)'; }
        e.title = it.name;
      } else {
        e.className = 'style-btn' + (i===currentIdx?' active':'');
        e.textContent = it;
      }
      e.addEventListener('click', ()=>{ onPick(i); buildPetControls(); refreshPet(); });
      sw.appendChild(e);
    });
    wrap.appendChild(sw);
    c.appendChild(wrap);
  }
  petGroup('SPECIES', PET_SPECIES, pet.species, i=>pet.species=i, false);
  petGroup('BODY COLOR', PET_COLORS, pet.body, i=>pet.body=i);
  petGroup('PATTERN', PET_PATTERNS, pet.pattern, i=>pet.pattern=i, false);
  petGroup('EYE COLOR', EYE_COLORS, pet.eye, i=>pet.eye=i);
  petGroup('COLLAR', COLLAR_COLORS, pet.collar, i=>pet.collar=i);
}

function rerollPets() {
  const g = document.getElementById('pet-variants');
  if (!g) return;
  g.innerHTML = '';
  for (let i = 0; i < 16; i++) {
    const opts = {
      species: randInt(2),
      body: PET_COLORS[randInt(PET_COLORS.length)],
      pattern: randInt(PET_PATTERNS.length),
      eye: EYE_COLORS[randInt(EYE_COLORS.length)],
      collar: Math.random() < 0.7 ? COLLAR_COLORS[1 + randInt(COLLAR_COLORS.length - _cp(1))] : COLLAR_COLORS[0],
    };
    const item = document.createElement('div'); item.className='var-item';
    const cv = document.createElement('canvas'); cv.className='spr';
    cv.width = 24; cv.height = 20;
    cv.style.width = '96px'; cv.style.height = '80px';
    item.appendChild(cv);
    drawPet(cv.getContext('2d'), opts);
    g.appendChild(item);
  }
}

function drawSynth(ctx, x, y) {
  // 32w × 28h synth on X-frame stand
  const bodyB = '#1a1a22', bodyH = '#3a3a4a', bodyD = '#0a0a14';
  const knob = '#888888', led = '#e83020';
  // Keyboard housing (top horizontal)
  rect(ctx, x, y + 2, 32, 8, bodyB);
  rect(ctx, x, y + 2, 32, _cp(1), bodyH);
  rect(ctx, x, y + 9, 32, _cp(1), bodyD);
  // Control panel
  rect(ctx, x + 2, y + 3, 28, 2, '#2a2a32');
  // Knobs (5)
  for (let i = 0; i < 5; i++) {
    const kx = x + 4 + i * 4;
    rect(ctx, kx, y + 3, 2, _cp(1), '#aaaaaa');
    rect(ctx, kx, y + 4, 2, _cp(1), knob);
    px(ctx, kx + _cp(1), y + 3, led);
  }
  // LCD display (right side)
  rect(ctx, x + 24, y + 3, 5, 2, '#0a3a18');
  rect(ctx, x + 25, y + 4, 3, _cp(1), '#30d030');
  // White keys
  rect(ctx, x + 2, y + 6, 28, 4, '#e8e8e8');
  rect(ctx, x + 2, y + 9, 28, _cp(1), '#aaaaaa');
  // Black keys (every other)
  for (let i = 0; i < 6; i++) {
    rect(ctx, x + 4 + i * 5, y + 6, _cp(1), 2, '#222');
    rect(ctx, x + 6 + i * 5, y + 6, _cp(1), 2, '#222');
  }
  // X-stand

function drawBookshelf(ctx, x, y) {
  // 28w × 36h regular bookshelf (books, not vinyl)
  const wood = '#5a3818', woodH = '#7a4828', woodS = '#3a2010', woodD = '#1a0a04';
  rect(ctx, x, y, 28, 36, wood);
  rect(ctx, x, y, 28, _cp(1), woodH);
  rect(ctx, x, y, _cp(1), 36, woodS);
  rect(ctx, x + 27, y, _cp(1), 36, woodS);
  const shelves = [4, 12, 20, 28];
  for (const sy of shelves) rect(ctx, x + _cp(1), y + sy, 26, _cp(1), woodD);
  const palette = ['#d83020','#208090','#a83820','#e8a040','#3050c0','#308050','#202020','#a050c0','#e8e8e8','#888888'];
  // Shelf 1 — varying heights
  let xPos = x + 2;
  for (let i = 0; i < 8; i++) {
    const h = 6 + (i % 3 === 0 ? 1 : 0);
    rect(ctx, xPos, y + 4 - (h - 6) + _cp(1), 2, h - _cp(1), palette[i % palette.length]);
    px(ctx, xPos, y + 4 - (h - 6) + _cp(1), '#000');
    px(ctx, xPos + _cp(1), y + 6, '#ffffff');
    xPos += 3;
  }
  // Shelf 2 — books + small horizontal stack
  for (let i = 0; i < 4; i++) {
    rect(ctx, x + 2 + i * 3, y + 13, 2, 6, palette[(i + 2) % palette.length]);
    px(ctx, x + 2 + i * 3, y + 13, '#000');
  }
  // Horizontal book stack
  rect(ctx, x + 16, y + 16, 10, _cp(1), '#e8c060');
  rect(ctx, x + 16, y + 17, 10, _cp(1), '#3050c0');
  rect(ctx, x + 16, y + 18, 10, _cp(1), '#a83820');
  // Small framed photo
  rect(ctx, x + 18, y + 13, 6, 3, '#3a1408');
  rect(ctx, x + 19, y + 14, 4, _cp(1), '#80a0c0');
  // Shelf 3 — books + plant
  for (let i = 0; i < 5; i++) {
    rect(ctx, x + 2 + i * 3, y + 21, 2, 6, palette[(i + 5) % palette.length]);
    px(ctx, x + 2 + i * 3, y + 21, '#000');
  }
  // Plant
  rect(ctx, x + 19, y + 22, 5, 5, '#208050');
  px(ctx, x + 20, y + 22, '#50a070');
  rect(ctx, x + 20, y + 27, 3, _cp(1), '#a05028');
  // Shelf 4 (bottom) — books
  for (let i = 0; i < 9; i++) {
    rect(ctx, x + 2 + i * 3, y + 29, 2, 6, palette[(i + 4) % palette.length]);
    px(ctx, x + 2 + i * 3, y + 29, '#000');
  }
  // Outline
  rect(ctx, x, y - _cp(1), 28, _cp(1), '#1a0a04');
  rect(ctx, x - _cp(1), y, _cp(1), 36, '#1a0a04');
  rect(ctx, x + 28, y, _cp(1), 36, '#1a0a04');
  rect(ctx, x, y + 36, 28, _cp(1), '#1a0a04');
}

function buildControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  function ctrlGroup(label, items, currentIdx, onPick, colorPicker=true) {
    const wrap = document.createElement('div'); wrap.className='ctrl';
    const n = document.createElement('div'); n.className='ctrl-name'; n.textContent=label;
    wrap.appendChild(n);
    const sw = document.createElement('div'); sw.className = colorPicker ? 'swatches' : 'style-btns';
    items.forEach((it,i)=>{
      const e = document.createElement('div');
      if(colorPicker) {
        e.className = 'swatch' + (i===currentIdx?' active':'');
        e.style.background = it.base;
        e.title = it.name;
      } else {
        e.className = 'style-btn' + (i===currentIdx?' active':'');
        e.textContent = it;
      }
      e.addEventListener('click', ()=>{ onPick(i); buildControls(); refreshHero(); });
      sw.appendChild(e);
    });
    wrap.appendChild(sw);
    c.appendChild(wrap);
  }
  ctrlGroup('SKIN', SKIN_TONES, current.skin, i=>current.skin=i);
  ctrlGroup('HAIR / HAT', HAIR_STYLES, current.hairStyle, i=>current.hairStyle=i, false);
  ctrlGroup('HAIR COLOR', HAIR_COLORS, current.hair, i=>current.hair=i);

function randInt(n){return Math.floor(Math.random()*n);}

// Module-level state for animated variant strips: regenerated on user click,
// re-rendered per rAF tick at the current walk frame.
let variantOpts = [];
let variantCanvases = [];
let galleryOpts = [];
let galleryCanvases = [];

// Per-section view state — STAND default (idle pose, frame=0, facing S)
let variantsFacing = 'S';
let variantsWalk   = false;
let galleryFacing  = 'S';
let galleryWalk    = false;

function setSectionView(which, mode) {
  // mode: 'STAND' | 'S' | 'E' | 'N'
  if (which === 'variants') {
    variantsWalk   = mode !== 'STAND';
    variantsFacing = mode === 'STAND' ? 'S' : mode;
  } else {
    galleryWalk   = mode !== 'STAND';
    galleryFacing = mode === 'STAND' ? 'S' : mode;
  }
  ['STAND','S','E','N'].forEach(m => {
    const btn = document.getElementById(`${which}-view-${m}`);
    if (btn) btn.classList.toggle('active', m === mode);
  });
  // Immediate redraw so STAND/facing switches don't wait for the next tick
  if (which === 'variants') renderVariants(); else renderGallery();
}

function rerollVariants() {
  const g = document.getElementById('variants');
  g.innerHTML = '';
  variantOpts = [];
  variantCanvases = [];
  for(let i=0;i<16;i++) {
    const opts = {
      skin: SKIN_TONES[randInt(SKIN_TONES.length)],
      hair: HAIR_COLORS[randInt(HAIR_COLORS.length)],
      hairStyle: randInt(HAIR_STYLES.length),
      shirt: SHIRT_COLORS[randInt(SHIRT_COLORS.length)],
      pants: PANTS_COLORS[randInt(PANTS_COLORS.length)],
      shoes: SHOE_COLORS[randInt(SHOE_COLORS.length)],
    };
    variantOpts.push(opts);
    const item = document.createElement('div'); item.className='var-item';
    const cv = document.createElement('canvas'); cv.className='spr';
    cv.width=36; cv.height=48+CHIBI_HEAD_ROOM; cv.style.width='144px'; cv.style.height='228px';
    item.appendChild(cv);
    g.appendChild(item);
    variantCanvases.push(cv);
    drawChar(cv.getContext('2d'), opts, currentFrame);
  }
}
function renderVariants() {
  const f = variantsWalk ? currentFrame : 0;
  for (let i = 0; i < variantCanvases.length; i++) {
    drawChar(variantCanvases[i].getContext('2d'),
             { ...variantOpts[i], facing: variantsFacing }, f);
  }
}

let walkOn = false;

function toggleWalk() {
  walkOn = !walkOn;
  const btn = document.getElementById('walk-toggle');
  if (btn) btn.textContent = walkOn ? 'WALK' : 'STAND';
  // Snap hero to neutral pose immediately when stopping
  refreshHero();
}

function setFacing(f) {
  heroFacing = f;
  ['S','E','N','W'].forEach(d => {
    const btn = document.getElementById('facing-' + d);
    if (btn) btn.classList.toggle('active', d === f);
  });
  refreshHero();
}

function syncBodyBackground(roomId) {
  const outdoor = ['garden','rooftop'].includes(roomId);
  if (outdoor) {
    const tod = getTimeOfDay();
    document.body.style.background = SKY_COLORS[tod].top;
  } else {
    document.body.style.background = '#000000';
  }
}

function setActiveRoom(id) {
  if (!rooms[id] || id === activeRoomId) return;
  if (worldTransition.active) { activeRoomId = worldTransition.toId; worldTransition.active = false; }
  const trans = ROOM_TRANSITIONS[`${activeRoomId}→${id}`] || { type:'crossfade' };
  worldTransition = { active:true, type:trans.type, direction:trans.direction, progress:0, fromId:activeRoomId, toId:id, duration:10 };
  // Reset camera
  worldCamX = 0;
  document.querySelectorAll('[id^="room-btn-"]').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('room-btn-' + id);
  if (btn) btn.classList.add('active');
  syncBodyBackground(id);
}

function toggleSky() {
  const states = [null, 'day', 'dusk', 'night', 'dawn'];
  const currentIndex = states.indexOf(_skyOverride);
  const nextIndex = (currentIndex + _cp(1)) % states.length;
  _skyOverride = states[nextIndex];
  const btn = document.getElementById('sky-toggle');
  if (btn) {
    const label = _skyOverride ? _skyOverride.toUpperCase() : 'AUTO';
    btn.textContent = 'SKY: ' + label;
  }
  syncBodyBackground(activeRoomId);
}

// Shared canopy helper — 3-layer arc cluster centered on (cx, cy) with base radius r.
function drawTreeCanopy(ctx, cx, cy, r, shadowCol, baseCol, highlightCol) {
  // Defaults: green foliage (tree-outdoor / tree-tall / plant).
  // tree-flower passes pink palette; tree-pine uses tiered rects (no canopy).
  shadowCol    = shadowCol    ?? '#2a5010';
  baseCol      = baseCol      ?? '#4a8020';
  highlightCol = highlightCol ?? '#80c030';
  // Shadow layer (offset down)
  ctx.fillStyle = shadowCol;
  ctx.beginPath(); ctx.arc(cx, cy + 2, r, 0, Math.PI * 2); ctx.fill();
  // Base layer
  ctx.fillStyle = baseCol;
  ctx.beginPath(); ctx.arc(cx, cy, r - 2, 0, Math.PI * 2); ctx.fill();
  // Irregular offset blob (breaks perfect circle)
  ctx.beginPath(); ctx.arc(cx + r * 0.4, cy + r * 0.25, r * 0.55, 0, Math.PI * 2); ctx.fill();
  // Highlight (top-left lit)
  ctx.fillStyle = highlightCol;
  ctx.beginPath(); ctx.arc(cx - r * 0.3, cy - r * 0.25, r * 0.45, 0, Math.PI * 2); ctx.fill();
}

// Kidney pool — bezier shape with stone surround + water + tile grid + integrated stairs + diving board
function tracePoolKidney(ctx, w, h) {
  const sx = w / 240, sy = h / 170;  // scale from reference 240×170
  ctx.beginPath();
  ctx.moveTo(120 * sx, 8 * sy);
  ctx.bezierCurveTo(40 * sx, 8 * sy,   8 * sx, 60 * sy,  32 * sx, 100 * sy);
  ctx.bezierCurveTo(56 * sx, 140 * sy, 100 * sx, 156 * sy, 140 * sx, 128 * sy);
  ctx.bezierCurveTo(150 * sx, 120 * sy, 170 * sx, 120 * sy, 190 * sx, 136 * sy);
  ctx.bezierCurveTo(220 * sx, 152 * sy, 236 * sx, 100 * sy, 216 * sx, 64 * sy);
  ctx.bezierCurveTo(200 * sx, 24 * sy, 160 * sx, 8 * sy, 120 * sx, 8 * sy);
  ctx.closePath();
}
function drawPoolKidney(ctx, f) {
  const w = f.w, h = f.h;
  const stone = '#d8c8a0', stoneH = '#e8d8b0', stoneD = '#b0a080';
  const water = '#3090d0', waterD = '#1870b0', waterT = '#2878b8', waterH = '#60b8f0';
  const stair = '#c8b890', stairH = '#d8c8a0', stairD = '#a09870';
  const board = '#f0e8d0', boardH = '#fff8e8', boardS = '#e03020';
  // Stone surround
  ctx.fillStyle = stone;
  tracePoolKidney(ctx, w, h); ctx.fill();
  // OL stroke around stone
  ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1;
  tracePoolKidney(ctx, w, h); ctx.stroke();
  // Water (inset 8 px for wider stone surround)
  ctx.save();
  ctx.translate(8, 8);
  tracePoolKidney(ctx, w - 16, h - 16);
  ctx.fillStyle = water; ctx.fill();
  // Clip water for shadow / grid / shimmer
  tracePoolKidney(ctx, w - 16, h - 16); ctx.clip();
  // Deep shadow bottom half
  ctx.fillStyle = waterD;
  ctx.fillRect(0, (h - 16) / 2, w - 16, (h - 16) / 2);
  // Tile grid 8 px
  ctx.fillStyle = waterT;
  for (let y = 8; y < h - 16; y += 8) ctx.fillRect(0, y, w - 16, _cp(1));
  for (let x = 8; x < w - 16; x += 8) ctx.fillRect(x, 0, _cp(1), h - 16);
  // Highlight shimmer (upper-left strip)
  ctx.fillStyle = waterH;
  ctx.fillRect(16, 12, 48, 4);
  ctx.restore();
  // OL stroke around water (interior pool edge)
  ctx.save();
  ctx.translate(8, 8);
  tracePoolKidney(ctx, w - 16, h - 16);
  ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
  // ── Integrated stairs (left side, 4 steps descending into water) ──
  const sx = 16, sy = h / 2 - 20;  // position stairs mid-left
  // Step 1 (shallowest, widest)
  rect(ctx, sx, sy, 28, 8, stair);
  rect(ctx, sx, sy, 28, _cp(1), stairH);
  rect(ctx, sx, sy + 7, 28, _cp(1), stairD);
  // Step 2
  rect(ctx, sx + 4, sy + 8, 24, 8, stair);
  rect(ctx, sx + 4, sy + 8, 24, _cp(1), stairH);
  rect(ctx, sx + 4, sy + 15, 24, _cp(1), stairD);
  // Step 3
  rect(ctx, sx + 8, sy + 16, 20, 8, stair);
  rect(ctx, sx + 8, sy + 16, 20, _cp(1), stairH);
  rect(ctx, sx + 8, sy + 23, 20, _cp(1), stairD);
  // Step 4 (deepest, narrowest)
  rect(ctx, sx + 12, sy + 24, 16, 8, stair);
  rect(ctx, sx + 12, sy + 24, 16, _cp(1), stairH);
  rect(ctx, sx + 12, sy + 31, 16, _cp(1), stairD);
  // ── Integrated diving board (right side, extending over water) ──
  const bx = w - 52, by = h / 2 - 8;  // position board mid-right
  // Concrete base anchor
  rect(ctx, bx, by, 12, 16, stone);
  rect(ctx, bx, by, 12, _cp(1), stoneH);
  rect(ctx, bx + 11, by, _cp(1), 16, stoneD);
  // Board plank extending over water
  rect(ctx, bx + 12, by + 5, 40, 6, board);
  rect(ctx, bx + 12, by + 5, 40, _cp(1), boardH);
  rect(ctx, bx + 12, by + 10, 40, _cp(1), stoneD);
  // Safety stripes on plank
  rect(ctx, bx + 18, by + 5, 2, 6, boardS);
  rect(ctx, bx + 28, by + 5, 2, 6, boardS);
  rect(ctx, bx + 38, by + 5, 2, 6, boardS);
  // Plank tip taper
  rect(ctx, bx + 48, by + 6, 2, 4, stoneD);
}

// Diving board — 36×20 concrete base + spring + striped plank
function drawDivingBoard(ctx) {
  const con = '#b0a898', conH = '#d0c8b8', conD = '#706858';

function drawFurniture(ctx, f) {
  ctx.save();
  ctx.translate(f.x, f.y);

  if      (f.draw === 'table')          drawWorldTable(ctx);
  else if (f.draw === 'sofa')           drawWorldSofa(ctx, f);
  else if (f.draw === 'sofa-l')         drawSofaL(ctx, f);
  else if (f.draw === 'coffee-table')   drawCoffeeTable(ctx, f);
  else if (f.draw === 'counter')        drawWorldCounter(ctx, f);
  else if (f.draw === 'chair')          drawWorldChair(ctx);
  else if (f.draw === 'bean-bag')       drawBeanBag(ctx, f);
  else if (f.draw === 'foosball')       drawFoosball(ctx);
  else if (f.draw === 'jukebox')        drawJukebox(ctx);
  else if (f.draw === 'billboard')      drawBillboard(ctx);
  else if (f.draw === 'pool-kidney')    drawPoolKidney(ctx, f);
  else if (f.draw === 'diving-board')   drawDivingBoard(ctx);
  else if (f.draw === 'stairs')         drawStairs(ctx, f);
  else if (f.draw === 'plant')          drawWorldPlant(ctx);
  else if (f.draw === 'tree-outdoor')   drawTreeOutdoor(ctx);
  else if (f.draw === 'tree-tall')      drawTreeTall(ctx);

// Rug square — square geometric rug, 56×56px
function drawRugSquare(ctx, x, y) {
  const BASE = '#1a5a2a', BORDER = '#0e3a18', PATTERN = '#2a8a3a';
  const LIGHT = '#4ab854', GOLD = '#e8c040';
  // Base
  rect(ctx, x, y, 56, 56, BASE);
  // Outer border (2px)

  rect(ctx, x, y + 54, 56, 2, BORDER);
  rect(ctx, x, y, 2, 56, BORDER);
  rect(ctx, x + 54, y, 2, 56, BORDER);

  rect(ctx, x + 5, y + 5, 46, 2, LIGHT);
  rect(ctx, x + 5, y + 49, 46, 2, LIGHT);
  rect(ctx, x + 5, y + 5, 2, 46, LIGHT);
  rect(ctx, x + 49, y + 5, 2, 46, LIGHT);
  // Diagonal stripes every 8px (both directions)
  for (let i = 8; i < 56; i += 8) {
    // Diagonal top-left to bottom-right
    for (let j = 0; j < 56; j++) {
      if ((i + j) % 8 === 0) px(ctx, x + j, y + i - j < 0 ? 0 : i - j < 56 ? i - j : 55, PATTERN);
    }
    // Diagonal top-right to bottom-left
    for (let j = 0; j < 56; j++) {
      if ((56 - i + j) % 8 === 0) px(ctx, x + j, y + (56 - i + j) >= 0 && (56 - i + j) < 56 ? 56 - i + j : j < i ? j : 55, PATTERN);
    }
  }
  // Center star (8 points)
  const cx = x + 28, cy = y + 28;
  px(ctx, cx, cy - 6, GOLD);
  px(ctx, cx, cy + 6, GOLD);
  px(ctx, cx - 6, cy, GOLD);
  px(ctx, cx + 6, cy, GOLD);

  px(ctx, cx + 5, cy - 5, GOLD);
  px(ctx, cx - 5, cy + 5, GOLD);
  px(ctx, cx + 5, cy + 5, GOLD);
  // Center fill
  rect(ctx, cx - 2, cy - 2, 4, 4, GOLD);
