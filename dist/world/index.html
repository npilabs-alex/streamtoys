// ── COLLISION HELPERS ──
function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
function npcHitsFurniture(nx, ny, room) {
  // NPC footprint: 16×8 px centered at (nx, ny) — feet area
  const nLeft = nx - 8, nTop = ny - 4;
  const outdoorRooms = ['rooftop', 'garden'];
  const isOutdoor = outdoorRooms.includes(room.id);
  const wallH = isOutdoor ? WALL_H : INDOOR_WALL_H;

  for (const f of room.furniture) {
    if ((f.layer ?? 1) === 0) continue;
    if (f.noCollide) continue;
    // Wall-hugging items: only check floor portion (below wall)
    if (f.wallHugging) {
      const floorY = wallH;
      const floorH = f.y + f.h - wallH;
      if (floorH > 0 && rectsOverlap(nLeft, nTop, 16, 8, f.x, floorY, f.w, floorH)) return true;
    } else {
      if (rectsOverlap(nLeft, nTop, 16, 8, f.x, f.y, f.w, f.h)) return true;
    }
  }
  return false;
}
function pickWorldTarget(npc) {
  const room = rooms[npc.roomId] || rooms['living'];
  const margin = 24;
  const outdoorRooms = ['rooftop', 'garden'];
  const isOutdoor = outdoorRooms.includes(npc.roomId);
  const wallH = isOutdoor ? WALL_H : INDOOR_WALL_H;
  const topMargin  = (room.walls?.top)   ? wallH + margin : margin;
  const leftMargin = (room.walls?.left)  ? WALL_W + margin : margin;
  const rightMargin= (room.walls?.right) ? WALL_W + margin : margin;
  // pool exclusion for backyard unchanged
  let tx, ty, attempts = 0;
  do {
    tx = leftMargin + Math.random() * (room.W - leftMargin - rightMargin);
    ty = topMargin  + Math.random() * (room.H - topMargin - margin);
    attempts++;
  } while (attempts < 10 && npc.roomId === 'garden' && tx > 100 && tx < 340 && ty > 40 && ty < 210);
  return { tx, ty };
}

function tickWorldNPCs() {
  for (const npc of worldNPCs) {
    // Only tick NPCs in active room
    if (npc.roomId !== activeRoomId) continue;
    // Count down idle
    if (npc.idleTicks > 0) { npc.idleTicks--; continue; }

    const room = rooms[npc.roomId] || rooms['living'];
    const dx = npc.targetX - npc.x;
    const dy = npc.targetY - npc.y;
    const dist = Math.hypot(dx, dy);

    let nx = npc.x, ny = npc.y;
    let arrived = dist < npc.speed + 0.5;

    if (!arrived) {
      if (!npc.axis) npc.axis = 'x';
      if (npc.axis === 'x') {
        if (Math.abs(dx) < npc.speed) {
          npc.x = npc.targetX;
          npc.axis = 'y';
          if (Math.abs(npc.targetY - npc.y) < npc.speed + 0.5) arrived = true;
        } else {
          nx = npc.x + Math.sign(dx) * npc.speed;
          npc.facing = dx > 0 ? 'E' : 'W';
        }
      } else {
        if (Math.abs(dy) < npc.speed) {
          npc.y = npc.targetY;
          npc.axis = 'x';
          if (Math.abs(npc.targetX - npc.x) < npc.speed + 0.5) arrived = true;
        } else {
          ny = npc.y + Math.sign(dy) * npc.speed;
          npc.facing = dy > 0 ? 'S' : 'N';
        }
      }
    }

    if (arrived) {
      npc.x = npc.targetX; npc.y = npc.targetY;
      const { tx, ty } = pickWorldTarget(npc);
      npc.targetX = tx; npc.targetY = ty;
      npc.axis = Math.random() < 0.5 ? 'x' : 'y';
      if (Math.random() < 0.35) npc.idleTicks = 20 + Math.floor(Math.random() * 50);
      npc.stuckTicks = 0;
      continue;
    }
      // Room boundary collision — bounce to new target if too close to wall
      if (nx < 16 || nx > room.W - 16 || ny < 16 || ny > room.H - 16) {
        const { tx, ty } = pickWorldTarget(npc);
        npc.targetX = tx; npc.targetY = ty;
        continue;
      }
      // Furniture collision
      if (npcHitsFurniture(nx, ny, room)) {
        const { tx, ty } = pickWorldTarget(npc);
        npc.targetX = tx; npc.targetY = ty;
        npc.axis = Math.random() < 0.5 ? 'x' : 'y';
        const ndx = tx - npc.x, ndy = ty - npc.y;
        if (Math.abs(ndx) > Math.abs(ndy)) npc.facing = ndx > 0 ? 'E' : 'W';
        else                                npc.facing = ndy > 0 ? 'S' : 'N';
        continue;
      }
      // Stuck safety valve — if blocked for too long, teleport
      const didMove = Math.abs(nx - npc.x) > 0.01 || Math.abs(ny - npc.y) > 0.01;
      if (!didMove && !arrived) {
        npc.stuckTicks = (npc.stuckTicks || 0) + _cp(1);
        if (npc.stuckTicks > 3) {
          const safe = pickWorldTarget(npc);
          npc.x = safe.tx;
          npc.y = safe.ty;
          npc.targetX = safe.tx;
          npc.targetY = safe.ty;
          npc.stuckTicks = 0;
        }
      } else {
        npc.stuckTicks = 0;
      }
      // Commit position
      npc.x = nx; npc.y = ny;
    // Exit transition — after position commit, check if NPC feet overlap an exit
    for (const exit of (rooms[npc.roomId]?.exits || [])) {
      if (rectsOverlap(npc.x - 8, npc.y - 4, 16, 8, exit.x, exit.y, exit.w, exit.h)) {
        npc.roomId = exit.leadsTo;
        npc.x = exit.spawnX;
        npc.y = exit.spawnY;
        const { tx, ty } = pickWorldTarget(npc);
        npc.targetX = tx; npc.targetY = ty;
        npc.facing = 'S';
        break;
      }
    }
  }
}

function tickPlayer() {
  const room = rooms[activeRoomId] || rooms['living'];
  let nx = playerChar.x, ny = playerChar.y;
  let moved = false;

  // Keyboard movement (8-directional allowed for player)
  if (playerChar.keys.up)    { ny -= playerChar.speed; playerChar.facing = 'N'; moved = true; }
  if (playerChar.keys.down)  { ny += playerChar.speed; playerChar.facing = 'S'; moved = true; }
  if (playerChar.keys.left)  { nx -= playerChar.speed; playerChar.facing = 'W'; moved = true; }
  if (playerChar.keys.right) { nx += playerChar.speed; playerChar.facing = 'E'; moved = true; }

  // Click-to-move
  if (!moved && playerChar.clickTarget) {
    const dx = playerChar.clickTarget.x - playerChar.x;
    const dy = playerChar.clickTarget.y - playerChar.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < playerChar.speed + 0.5) {
      playerChar.x = playerChar.clickTarget.x;
      playerChar.y = playerChar.clickTarget.y;
      playerChar.clickTarget = null;
    } else {
      // Move toward click target
      nx = playerChar.x + (dx / dist) * playerChar.speed;
      ny = playerChar.y + (dy / dist) * playerChar.speed;
      // Update facing based on dominant direction
      if (Math.abs(dx) > Math.abs(dy)) playerChar.facing = dx > 0 ? 'E' : 'W';
      else                              playerChar.facing = dy > 0 ? 'S' : 'N';
      moved = true;
    }
  }

  if (moved) {
    // Room boundary clamp (respect walls)
    const outdoorRooms = ['rooftop', 'garden'];
    const isOutdoor = outdoorRooms.includes(activeRoomId);
    const wallH = isOutdoor ? WALL_H : INDOOR_WALL_H;
    const topMargin  = (room.walls?.top)   ? wallH + 16 : 16;
    const leftMargin = (room.walls?.left)  ? WALL_W + 16 : 16;
    const rightMargin= (room.walls?.right) ? WALL_W + 16 : 16;
    nx = Math.max(leftMargin, Math.min(room.W - rightMargin, nx));
    ny = Math.max(topMargin, Math.min(room.H - 16, ny));
    // Furniture collision — reuse existing npcHitsFurniture
    if (!npcHitsFurniture(nx, ny, room)) {
      playerChar.x = nx;
      playerChar.y = ny;
    }
  }

  // Exit detection — check if player walks into an exit rect
  for (const exit of (room.exits || [])) {
    if (playerChar.x >= exit.x && playerChar.x <= exit.x + exit.w &&
        playerChar.y >= exit.y && playerChar.y <= exit.y + exit.h) {
      setActiveRoom(exit.leadsTo);
      playerChar.x = exit.spawnX;
      playerChar.y = exit.spawnY;
      break;
    }
  }
}

function tickCamera() {
  const room = rooms[activeRoomId] || rooms['living'];
  const targetCamX = playerChar.x - 240; // center player in 480px viewport
  const clampedTarget = Math.max(0, Math.min(room.W - 480, targetCamX));
  // Smooth lerp — 10% per tick gives a nice lag
  worldCamX += (clampedTarget - worldCamX) * 0.1;
  worldCamX = Math.round(worldCamX);
}

function tickParticles() {
  // Cap at 80 particles
  if (worldParticles.length > 80) worldParticles.splice(0, worldParticles.length - 80);

  const room = rooms[activeRoomId];
  if (!room) return;

  // Spawn from furniture emitters
  for (const f of room.furniture) {
    if (!f.emitter) continue;
    if (Math.random() < f.emitter.rate) {
      worldParticles.push({
        x: f.x + f.w / 2 + (Math.random() - 0.5) * 8,
        y: f.y - 2,
        vx: (Math.random() - 0.5) * 0.3,
        vy: -(0.3 + Math.random() * 0.4),
        life: 30 + Math.floor(Math.random() * 20),
        maxLife: 50,
        color: f.emitter.color,
        type: f.emitter.type,
      });
    }
  }

  // Tick existing particles
  for (let i = worldParticles.length - _cp(1); i >= 0; i--) {
    const p = worldParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) worldParticles.splice(i, _cp(1));
  }
}

const FLOOR_COLORS = {
  lounge:   '#3d2e1e',
  studio:   '#2a3a1e',
  rooftop:  '#2e2e3d',
  backyard: '#2a4a1e',
};
const FLOOR_DOTS = {
  lounge:   '#5d4a32',
  studio:   '#3a5028',
  rooftop:  '#42425a',
  backyard: '#3a6028',
};
function drawWorldFloor(ctx, roomId, W, H) {
  const outdoorRooms = ['rooftop', 'garden'];
  const isOutdoor = outdoorRooms.includes(roomId);
  const surfaceStart = isOutdoor ? WALL_H : INDOOR_WALL_H;
  const surfaceH = H - surfaceStart;

  if (roomId === 'living') {
    // Light ash wood planks
    const plankColors = ['#d4b896','#c8aa88','#dcc0a0','#c4a480','#d8b890'];
    let rowIndex = 0;
    for (let y = surfaceStart; y < H; y += 12) {
      const plankH = Math.min(12, H - y);
      const color = plankColors[rowIndex % plankColors.length];
      rect(ctx, 0, y, W, plankH, color);
      // Plank divider
      if (y + plankH < H) rect(ctx, 0, y + plankH - _cp(1), W, _cp(1), '#9a7a5a');
      // Staggered vertical joints
      const jointX = (rowIndex * 137) % (W - 48) + 48;
      rect(ctx, jointX, y, _cp(1), plankH, '#9a7a5a');
      rowIndex++;
    }
    // Gradient overlay
    const grad = ctx.createLinearGradient(0, surfaceStart, 0, H);
    grad.addColorStop(0, 'rgba(255,235,210,0.12)');
    grad.addColorStop(1, 'rgba(0,0,0,0.18)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, surfaceStart, W, surfaceH);

  } else if (roomId === 'studio') {
    // Dark industrial tiles — 24×24 checkerboard
    for (let x = 0; x < W; x += 24) {
      for (let y = surfaceStart; y < H; y += 24) {
        const col = Math.floor(x / 24);
        const row = Math.floor((y - surfaceStart) / 24);
        const tileColor = ((col + row) % 2 === 0) ? '#2a2a2e' : '#252528';
        const tileW = Math.min(24, W - x);
        const tileH = Math.min(24, H - y);
        rect(ctx, x, y, tileW, tileH, tileColor);
        // Grout lines
        rect(ctx, x, y, tileW, _cp(1), '#1a1a1e');
        rect(ctx, x, y, _cp(1), tileH, '#1a1a1e');
      }
    }

  } else if (roomId === 'gym') {
    // Dark rubber tile — 32×32 checkerboard
    for (let x = 0; x < W; x += 32) {
      for (let y = surfaceStart; y < H; y += 32) {
        const col = Math.floor(x / 32);
        const row = Math.floor((y - surfaceStart) / 32);
        const tileColor = ((col + row) % 2 === 0) ? '#2a2420' : '#242018';
        const tileW = Math.min(32, W - x);
        const tileH = Math.min(32, H - y);
        rect(ctx, x, y, tileW, tileH, tileColor);
        // Grout lines
        rect(ctx, x, y, tileW, _cp(1), '#1a1610');
        rect(ctx, x, y, _cp(1), tileH, '#1a1610');
      }
    }

  } else if (roomId === 'rooftop') {
    // Poured concrete
    rect(ctx, 0, surfaceStart, W, surfaceH, '#8a8880');
    // Horizontal pour lines every ~32px
    for (let y = surfaceStart; y < H; y += 32) {
      rect(ctx, 0, y, W, _cp(1), '#9a9896');
    }
    // Crack lines (seeded deterministic)
    const cracks = [
      {x:120, y:surfaceStart+40, dx:35, dy:8},
      {x:380, y:surfaceStart+80, dx:-28, dy:12},
      {x:640, y:surfaceStart+20, dx:42, dy:-6},
      {x:200, y:surfaceStart+120, dx:30, dy:15},
      {x:520, y:surfaceStart+60, dx:-38, dy:10},
      {x:800, y:surfaceStart+100, dx:25, dy:-8}
    ];
    for (const c of cracks) {
      if (c.y < surfaceStart || c.y >= H) continue;
      const steps = Math.abs(c.dx) + Math.abs(c.dy);
      for (let i = 0; i <= steps; i++) {
        const x = c.x + Math.floor(c.dx * i / steps);
        const y = c.y + Math.floor(c.dy * i / steps);
        if (x >= 0 && x < W && y >= surfaceStart && y < H) px(ctx, x, y, '#6a6866');
      }
    }
    // Aggregate dots
    for (let i = 0; i < 80; i++) {
      const x = (i * 173) % W;
      const y = surfaceStart + ((i * 97) % surfaceH);
      const color = (i % 2 === 0) ? '#7a7876' : '#9a9896';
      px(ctx, x, y, color);
    }

  } else if (roomId === 'garden') {
    // Patchy grass — 16×16 cells
    const patchColors = ['#4a7a3a','#3a6a2a','#5a8a4a','#3a5a2a'];
    for (let x = 0; x < W; x += 16) {
      for (let y = surfaceStart; y < H; y += 16) {
        const cx = Math.floor(x / 16);
        const cy = Math.floor((y - surfaceStart) / 16);
        const color = patchColors[(cx * 7 + cy * 13) % 4];
        const cellW = Math.min(16, W - x);
        const cellH = Math.min(16, H - y);
        rect(ctx, x, y, cellW, cellH, color);
        // Grass blade highlights in lighter cells
        if (color === '#5a8a4a') {
          px(ctx, x + 3, y + 4, '#7aaa5a');
          px(ctx, x + 3, y + 5, '#7aaa5a');
          px(ctx, x + 10, y + 8, '#7aaa5a');
          px(ctx, x + 10, y + 9, '#7aaa5a');
          px(ctx, x + 6, y + 12, '#7aaa5a');
        }
      }
    }
    // Dirt patches — ellipse-shaped
    const dirtPatches = [
      {x:80, y:surfaceStart+60, w:12, h:8},
      {x:320, y:surfaceStart+120, w:14, h:10},
      {x:600, y:surfaceStart+40, w:10, h:6}
    ];
    for (const d of dirtPatches) {
      if (d.y < surfaceStart || d.y >= H) continue;
      for (let dx = -d.w/2; dx <= d.w/2; dx++) {
        for (let dy = -d.h/2; dy <= d.h/2; dy++) {
          if ((dx*dx)/(d.w*d.w/4) + (dy*dy)/(d.h*d.h/4) <= 1) {
            const px_x = d.x + dx;
            const px_y = d.y + dy;
            if (px_x >= 0 && px_x < W && px_y >= surfaceStart && px_y < H) {
              px(ctx, px_x, px_y, '#8a6a4a');
            }
          }
        }
      }
    }

  } else if (roomId === 'bedroom') {
    // Soft warm carpet
    rect(ctx, 0, surfaceStart, W, surfaceH, '#b8a090');
    // Carpet pile texture — horizontal lines every 4px
    for (let y = surfaceStart; y < H; y += 4) {
      rect(ctx, 0, y, W, _cp(1), '#c0a898');
    }
    // Gradient overlay
    const grad = ctx.createLinearGradient(0, surfaceStart, 0, H);
    grad.addColorStop(0, 'rgba(255,230,210,0.1)');
    grad.addColorStop(1, 'rgba(0,0,0,0.15)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, surfaceStart, W, surfaceH);

  } else if (roomId === 'office') {
    // Medium warm wood planks
    const plankColors = ['#b89870','#aa8860','#c0a078','#a48058','#b89068'];
    let rowIndex = 0;
    for (let y = surfaceStart; y < H; y += 12) {
      const plankH = Math.min(12, H - y);
      const color = plankColors[rowIndex % plankColors.length];
      rect(ctx, 0, y, W, plankH, color);
      // Plank divider
      if (y + plankH < H) rect(ctx, 0, y + plankH - _cp(1), W, _cp(1), '#7a5a3a');
      // Staggered vertical joints
      const jointX = (rowIndex * 137) % (W - 48) + 48;
      rect(ctx, jointX, y, _cp(1), plankH, '#7a5a3a');
      rowIndex++;
    }

  } else if (roomId === 'bathroom') {
    // Clean white tile — 16×16 checkerboard
    for (let x = 0; x < W; x += 16) {
      for (let y = surfaceStart; y < H; y += 16) {
        const col = Math.floor(x / 16);
        const row = Math.floor((y - surfaceStart) / 16);
        const tileColor = ((col + row) % 2 === 0) ? '#e8e4e0' : '#dedad6';
        const tileW = Math.min(16, W - x);
        const tileH = Math.min(16, H - y);
        rect(ctx, x, y, tileW, tileH, tileColor);
        // Grout lines
        rect(ctx, x, y, tileW, _cp(1), '#c8c4c0');
        rect(ctx, x, y, _cp(1), tileH, '#c8c4c0');
      }
    }
  }
}

function getRoomFloorCanvas(roomId, W, H) {
  const room = rooms[roomId];
  if (!room) return null;

  if (room._floorCanvas) return room._floorCanvas;

  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  drawWorldFloor(ctx, roomId, W, H);

  // DOM-anchor to prevent GC (belt-and-braces)
  c.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;pointer-events:none;';
  document.body.appendChild(c);

  room._floorCanvas = c;
  return c;
}

// ── ASSET PREVIEW (temporary — remove once 11 new asset types are reviewed) ──
function renderAssetPreview() {
  const cv = document.getElementById('asset-preview');
  if (!cv) return;
  const pctx = cv.getContext('2d');
  pctx.imageSmoothingEnabled = false;
  pctx.fillStyle = '#d4c8a0';
  pctx.fillRect(0, 0, cv.width, cv.height);
  // 4 cols × 8 rows = 32 cells exactly. Cell 160×135.
  const order = [
    'table',         'sofa',          'counter',          'chair',
    'plant',         'tree-outdoor',  'tree-tall',        'pool-kidney',
    'diving-board',  'sofa-l',        'coffee-table',     'bean-bag',
    'foosball',      'jukebox',       'billboard',        'stairs',
    'tree-palm',     'tree-pine',     'plant-cactus',     'tree-flower',
    'plant-hanging', 'plant-succulent','tree-pine-snow',  'plant-cactus-barrel',
    'plant-cactus-multi', 'plant-potted-tree', 'tree-pine-large', 'rug-runner',
    'rug-circle',    'rug-rect',      'rug-square',       'hedge',
  ];
  pctx.font = '10px monospace';
  pctx.textAlign = 'center';
  for (let i = 0; i < order.length; i++) {
    const type = order[i];
    const meta = ASSET_REGISTRY[type];
    const col = i % 4, row = Math.floor(i / 4);
    const cellX = col * 160, cellY = row * 135;
    // Anchor: horizontally centered, feet/base near cellY + 100 (room above for canopy / sign panel overhang).
    const ax = cellX + (160 - meta.defaultW) / 2;
    const ay = cellY + 100 - meta.defaultH;
    // Scale wrappers for oversized assets
    if (type === 'billboard') {
      pctx.save();
      pctx.translate(cellX + 80, cellY + 100);
      pctx.scale(0.55, 0.55);
      pctx.translate(-80, -100);
      drawFurniture(pctx, {
        x: ax, y: ay, w: meta.defaultW, h: meta.defaultH, draw: type,
        colorIndex: type === 'bean-bag' ? (i % 3) : 0,
      });
      pctx.restore();
    } else if (type === 'pool-kidney') {
      pctx.save();
      pctx.translate(cellX, cellY);
      pctx.scale(0.38, 0.38);
      pctx.translate(48, 8);
      drawFurniture(pctx, {
        x: ax, y: ay, w: meta.defaultW, h: meta.defaultH, draw: type,
        colorIndex: type === 'bean-bag' ? (i % 3) : 0,
      });
      pctx.restore();
    } else {
      drawFurniture(pctx, {
        x: ax, y: ay, w: meta.defaultW, h: meta.defaultH, draw: type,
        colorIndex: type === 'bean-bag' ? (i % 3) : 0,
      });
    }
    pctx.fillStyle = '#1a0e1a';
    pctx.fillText(meta.label, cellX + 80, cellY + 125);
  }
}

function drawSpeechBubble(ctx, x, y, text, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = 'bold 6px monospace';
  const tw = Math.ceil(ctx.measureText(text).width);
  const pad = 3, bw = tw + pad*2, bh = 9;
  const bx = Math.round(x - bw/2), by = Math.round(y - bh - 6);
  // Background + border
  ctx.fillStyle = '#f0ece0';
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = '#1a0e1a';
  ctx.fillRect(bx, by, bw, _cp(1));       // top
  ctx.fillRect(bx, by+bh-1, bw, _cp(1));  // bottom
  ctx.fillRect(bx, by, _cp(1), bh);       // left
  ctx.fillRect(bx+bw-1, by, _cp(1), bh);  // right
  // Tail (3px pointing down)
  ctx.fillStyle = '#f0ece0';
  ctx.fillRect(Math.round(x-1), by+bh, 3, 2);
  ctx.fillStyle = '#1a0e1a';
  ctx.fillRect(Math.round(x), by+bh+1, _cp(1), _cp(1));
  // Text
  ctx.fillStyle = '#1a0e1a';
  ctx.fillText(text, bx + pad, by + bh - 2);
  ctx.restore();
}

let _skyOverride = null;  // null = auto, or 'day'/'dusk'/'night'/'dawn'

function getTimeOfDay() {
  if (_skyOverride) return _skyOverride;
  const h = new Date().getHours();
  if (h >= 6  && h < 8)  return 'dawn';
  if (h >= 8  && h < 18) return 'day';
  if (h >= 18 && h < 20) return 'dusk';
  return 'night';
}

const SKY_COLORS = {
  night: { top:'#080618', horizon:'#18123a' },
  dawn:  { top:'#180830', horizon:'#8a4820' },
  dusk:  { top:'#28080e', horizon:'#8a3010' },
  day:   { top:'#1a4a7a', horizon:'#4a8ab8' },
};

// Gradient cache (FIX 5 — reuse gradients)
const _skyGradCache = {};
const _windowGradCache = {};

function drawParapet(ctx, W) {
  // Stone parapet — 52px tall, crenellations at top, brick pattern below

  // Wall body: y=12-52 (40px)
  rect(ctx, 0, 12, W, 40, '#7a6a5a');

  // Top edge highlight
  rect(ctx, 0, 12, W, _cp(1), '#9a8a78');

  // Brick mortar — horizontal lines every 10px
  rect(ctx, 0, 22, W, _cp(1), '#5a4a3a');
  rect(ctx, 0, 32, W, _cp(1), '#5a4a3a');
  rect(ctx, 0, 42, W, _cp(1), '#5a4a3a');

  // Brick mortar — vertical lines, staggered pattern
  for (let x = 0; x < W; x += 16) {
    rect(ctx, x, 12, _cp(1), 10, '#5a4a3a'); // row 1
    rect(ctx, x, 32, _cp(1), 10, '#5a4a3a'); // row 3
  }
  for (let x = 8; x < W; x += 16) {
    rect(ctx, x, 22, _cp(1), 10, '#5a4a3a'); // row 2 (offset)
    rect(ctx, x, 42, _cp(1), 10, '#5a4a3a'); // row 4 (offset)
  }

  // Crenellations — alternating solid merlons / sky gaps every 24px
  for (let x = 0; x < W; x += 24) {
    rect(ctx, x, 0, 12, 12, '#7a6a5a'); // solid merlon (12px wide)
    // Gap from x+12 to x+24 is transparent — sky shows through
  }
}

function drawGardenFence(ctx, W) {
  // Timber fence — 52px tall, posts + rails + planks with gaps

  const postColor = '#6a4a1a';
  const railColor = '#8a6a2a';
  const plankColor = '#7a5a2a';
  const capColor = '#aa8a3a';

  // Top rail
  rect(ctx, 0, 2, W, 5, railColor);

  // Bottom rail
  rect(ctx, 0, 44, W, 5, railColor);

  // Planks between posts — every 10px with 3px gaps (sky shows through)
  for (let x = 0; x < W; x += 10) {
    rect(ctx, x, 0, 7, 52, plankColor); // 7px plank, 3px gap
  }

  // Fence posts every 32px (drawn on top)
  for (let x = 0; x < W; x += 32) {
    rect(ctx, x, 0, 6, 52, postColor);
    // Top cap
    rect(ctx, x, 0, 6, 3, capColor);
  }
}

function drawSkyWall(ctx, roomId, W) {
  // 1. Sky background — full WALL_H (52px), drawn first
  const tod = getTimeOfDay();
  const colors = SKY_COLORS[tod];
  const gradKey = `${tod}_${W}`;
  if (!_skyGradCache[gradKey]) {
    const g = ctx.createLinearGradient(0, 0, 0, WALL_H);
    g.addColorStop(0, colors.top);
    g.addColorStop(1, colors.horizon);
    _skyGradCache[gradKey] = g;
  }
  ctx.fillStyle = _skyGradCache[gradKey];
  ctx.fillRect(0, 0, W, WALL_H);

  // Stars — night/dawn only, top 28px, ~25 dots max
  if (tod === 'night' || tod === 'dawn') {
    let starCount = 0;
    for (let x = 7; x < W && starCount < 25; x += 29) {
      for (let y = 3; y < 28 && starCount < 25; y += 19) {
        if ((x * 7 + y * 13) % 4 !== 0) continue;
        const bright = ((x + y) % 2 === 0) ? '#d8d8f0' : '#9090b8';
        px(ctx, x, y, bright);
        starCount++;
      }
    }
  }

  // Moon — night only, top right
  if (tod === 'night') {
    const mx = W - 48, my = 6;
    rect(ctx, mx+1, my,   6, 8, '#dcdcc8');
    rect(ctx, mx,   my+2, 8, 4, '#dcdcc8');
    rect(ctx, mx+2, my+2, 3, 3, '#c8c8b0'); // crater
  }

  // Sun — day only, top right
  if (tod === 'day') {
    const sx = W - 40, sy = 6;
    rect(ctx, sx+2, sy,   4, 8, '#f8e040');
    rect(ctx, sx,   sy+2, 8, 4, '#f8e040');
    rect(ctx, sx+2, sy+2, 4, 4, '#fff8a0'); // bright centre
  }

  // 2. Wall — full WALL_H (52px), drawn on top of sky
  if (roomId === 'rooftop') {
    drawParapet(ctx, W);
  } else if (roomId === 'garden') {
    drawGardenFence(ctx, W);
  }
}

function drawLivingWindow(ctx, cx, tod) {
  const topW  = 88;   // width at top of wall
  const botW  = 64;   // width at bottom — narrower = sense of height
  const y0    = 2;    // top of window (inside wall)
  const y1    = INDOOR_WALL_H - 2;  // bottom of window

  const txl = cx - topW/2;  // top-left x
  const txr = cx + topW/2;  // top-right x
  const bxl = cx - botW/2;  // bottom-left x
  const bxr = cx + botW/2;  // bottom-right x

  // Sky fill inside window (matches time of day) — cached gradient
  const skyColors = {
    day:   { top:'#1a4a7a', horizon:'#4a8ab8' },
    night: { top:'#080618', horizon:'#18123a' },
    dusk:  { top:'#28080e', horizon:'#8a3010' },
    dawn:  { top:'#180830', horizon:'#8a4820' },
  };
  const sc = skyColors[tod] || skyColors.day;
  const gradKey = `${tod}_${y0}_${y1}`;
  if (!_windowGradCache[gradKey]) {
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, sc.top);
    g.addColorStop(1, sc.horizon);
    _windowGradCache[gradKey] = g;
  }

  ctx.fillStyle = _windowGradCache[gradKey];
  ctx.beginPath();
  ctx.moveTo(txl, y0);
  ctx.lineTo(txr, y0);
  ctx.lineTo(bxr, y1);
  ctx.lineTo(bxl, y1);
  ctx.closePath();
  ctx.fill();

  // Window frame — thin dark outline
  ctx.strokeStyle = '#2a1e14';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Subtle window reflection/glare — thin diagonal highlight
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(txl + 6, y0 + 4);
  ctx.lineTo(bxl + 4, y1 - 6);
  ctx.stroke();

  // Frame reveal — 2px lighter inner edge top and left
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(txl, y0, txr - txl, 2);  // top reveal
}

function drawRoomWall(ctx, side, roomId, w, h, offsetX = 0) {
  // Wall colour per room
  const wallColors = {
    lounge:  { base: '#1a1208', mid: '#2e2010', trim: '#1e1408', board: '#4a3422' },
    studio:  { base: '#14201a', mid: '#222818', trim: '#1a2010', board: '#344030' },
    rooftop: { base: '#3a3a44', mid: '#2e2e38', trim: '#22222e', board: '#484858' },
    backyard:{ base: '#2a4018', mid: '#223410', trim: '#1a2a0e', board: '#344e20' },
  };
  const wc = wallColors[roomId] || wallColors.lounge;

  const outdoorRooms = ['rooftop', 'garden'];
  const isOutdoor = outdoorRooms.includes(roomId);
  const wallH = isOutdoor ? WALL_H : INDOOR_WALL_H;

  if (side === 'top') {
    if (isOutdoor) {
      drawSkyWall(ctx, roomId, w);
    } else {
      // Base wall fill
      rect(ctx, offsetX, 0, w, h, wc.base);
      // Horizontal wall boards (every 14px)
      for (let y = 8; y < h - 4; y += 14) {
        rect(ctx, offsetX + 2, y, w - 4, _cp(1), wc.mid);
        rect(ctx, offsetX + 2, y + _cp(1), w - 4, 12, wc.board);
        rect(ctx, offsetX + 2, y + 12, w - 4, _cp(1), wc.trim);
      }
      // Baseboard (floor junction)
      rect(ctx, offsetX, h - 4, w, 2, wc.trim);
      rect(ctx, offsetX, h - 2, w, 2, '#1a0e1a');

      // Living room windows
      if (roomId === 'living') {
        const tod = getTimeOfDay();
        drawLivingWindow(ctx, 240,  tod);
        drawLivingWindow(ctx, 720,  tod);
        drawLivingWindow(ctx, 1200, tod);
      }
    }
  } else if (side === 'left') {
    rect(ctx, 0, wallH, w, h - wallH, wc.base);
    // Vertical boards
    for (let x = 2; x < w - 2; x += 5) rect(ctx, x, wallH, _cp(1), h - wallH, wc.mid);
    rect(ctx, w - 2, wallH, 2, h - wallH, '#1a0e1a');
  } else if (side === 'right') {
    rect(ctx, offsetX, wallH, w, h - wallH, wc.base);
    for (let x = offsetX + 2; x < offsetX + w - 2; x += 5) rect(ctx, x, wallH, _cp(1), h - wallH, wc.mid);
    rect(ctx, offsetX, wallH, 2, h - wallH, '#1a0e1a');
  }
}

function renderRoomToBuffer(roomId, targetCtx) {
  const room = rooms[roomId] || rooms['living'];

  // Clear viewport
  targetCtx.clearRect(0, 0, 480, 270);

  // Apply camera offset
  targetCtx.save();
  targetCtx.translate(-Math.round(worldCamX), 0);

  // ── BACK WALL ──────────────────────────────────────────────
  const outdoorRooms = ['rooftop', 'garden'];
  const isOutdoor = outdoorRooms.includes(roomId);

  // Indoor rooms: solid fill behind wall zone — prevents body background bleed
  if (!isOutdoor) {
    targetCtx.fillStyle = '#1a1410';  // near-black warm dark
    targetCtx.fillRect(0, 0, room.W, INDOOR_WALL_H);
  }

  if (room.walls?.top) {
    const wallH = isOutdoor ? WALL_H : INDOOR_WALL_H;
    drawRoomWall(targetCtx, 'top', roomId, room.W, wallH);
  }

  // Floor cache — stored in global Map (immune to GC, respects canvas transforms)
  if (!window._floorCaches) window._floorCaches = new Map();
  if (!window._floorCaches.has(roomId)) {
    console.warn('[floor] building cache for', roomId);
    const c = document.createElement('canvas');
    c.width = room.W; c.height = room.H;
    const fctx = c.getContext('2d');
    fctx.imageSmoothingEnabled = false;
    drawWorldFloor(fctx, roomId, room.W, room.H);
    window._floorCaches.set(roomId, c);
  }
  targetCtx.drawImage(window._floorCaches.get(roomId), 0, 0);

  // ── SIDE WALLS (drawn after floor so they're visible) ──────
  if (room.walls?.left) {
    drawRoomWall(targetCtx, 'left', roomId, WALL_W, room.H);
  }
  if (room.walls?.right) {
    drawRoomWall(targetCtx, 'right', roomId, WALL_W, room.H, room.W - WALL_W);
  }

  // Unified painter's pass (furniture + NPCs + player filtered by roomId)
  _drawables.length = 0;
  for (const f of room.furniture) {
    _drawables.push({ kind: 'furniture', data: f, sortY: f.y + f.h, layer: f.layer ?? 1 });
  }
  for (const npc of worldNPCs) {
    if (npc.roomId !== roomId) continue;
    _drawables.push({ kind: 'npc', data: npc, sortY: npc.y, layer: 1 });
  }
  // Add player (renders at same layer as NPCs, sorted by Y)
  _drawables.push({ kind: 'player', data: playerChar, sortY: playerChar.y, layer: 1 });
  // Layer-aware sort: layer 0 (rugs) render first, then sort by sortY
  _drawables.sort((a, b) => {
    const la = a.layer ?? 1, lb = b.layer ?? 1;
    if (la !== lb) return la - lb;
    return a.sortY - b.sortY;
  });

  for (const d of _drawables) {
    if (d.kind === 'furniture') {
      drawFurniture(targetCtx, d.data);
    } else if (d.kind === 'npc' || d.kind === 'player') {
      const npc = d.data;
      const isPlayer = d.kind === 'player';
      let npcScale = 1.0;
      const stairItem = room.furniture.find(
        sf => sf.stairTopY !== undefined &&
              npc.y >= sf.stairTopY && npc.y <= sf.stairBottomY
      );
      if (stairItem) {
        const t = (npc.y - stairItem.stairBottomY) /
                  (stairItem.stairTopY - stairItem.stairBottomY);
        npcScale = 1.0 - t * 0.2;
      }
      targetCtx.save();
      targetCtx.globalAlpha = 0.12;
      drawEllipse(targetCtx, npc.x, npc.y + 3, Math.round(19 * npcScale), Math.round(6 * npcScale), '#000000');
      targetCtx.globalAlpha = 0.30;
      drawEllipse(targetCtx, npc.x, npc.y + 2, Math.round(12  * npcScale), Math.round(5 * npcScale), '#000000');
      targetCtx.globalAlpha = 1.0;
      targetCtx.restore();
      targetCtx.save();
      targetCtx.translate(npc.x - 18 * npcScale, npc.y - 48 * npcScale);
      drawTinyChar(targetCtx, { ...npc.opts, facing: npc.facing }, npcScale, currentFrame);
      targetCtx.restore();
    }
  }

  // Particle pass — on top of all furniture and NPCs
  for (const p of worldParticles) {
    const alpha = p.life / p.maxLife;
    targetCtx.save();
    targetCtx.globalAlpha = alpha;
    if (p.type === 'note') {
      // 3×3 pixel music note glyph
      targetCtx.fillStyle = p.color;
      targetCtx.fillRect(Math.round(p.x),   Math.round(p.y),   2, 3); // stem+head
      targetCtx.fillRect(Math.round(p.x)-1, Math.round(p.y)+2, 3, _cp(1)); // flag
    } else if (p.type === 'steam') {
      // 1×2 wispy dot
      targetCtx.fillStyle = p.color;
      targetCtx.fillRect(Math.round(p.x), Math.round(p.y), _cp(1), 2);
    } else if (p.type === 'leaf') {
      // 2×1 leaf dot
      targetCtx.fillStyle = p.color;
      targetCtx.fillRect(Math.round(p.x), Math.round(p.y), 2, _cp(1));
    }
    targetCtx.restore();
  }

  // Restore camera offset
  targetCtx.restore();
}

// Helper — converts '#rrggbb' to 'rgba(r,g,b,a)' for gradient stops
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// Lighting overlay: ambient darkness + radial light sources with color tint
function updateLighting(frameTick) {
  const lc = ROOM_LIGHTING[activeRoomId];
  if (!lc) { lightingCtx.clearRect(0, 0, 480, 270); return; }

  const tod    = getTimeOfDay();
  const todIdx = { day:0, dawn:1, dusk:2, night:3 }[tod] ?? 0;
  const alpha  = lc.ambient[todIdx];

  lightingCtx.clearRect(0, 0, 480, 270);
  if (alpha <= 0 && lc.lights.length === 0) return;

  // --- Pass 1: ambient darkness fill with radial light holes ---
  if (alpha > 0) {
    lightingCtx.save();

    // Build composite: start with solid dark fill, subtract light circles
    lightingCtx.globalCompositeOperation = 'source-over';
    lightingCtx.fillStyle = `rgba(0,0,0,${alpha})`;
    lightingCtx.fillRect(0, 0, 480, 270);

    // Punch a radial hole for each light source
    lightingCtx.globalCompositeOperation = 'destination-out';
    for (const src of lc.lights) {
      // Apply camera offset for wide rooms
      const sx = src.x - (worldCamX || 0);
      const sy = src.y;
      // Flicker: modulate radius & intensity for fire sources
      let r = src.radius;
      let eff = src.intensity;
      if (src._flicker) {
        const flicker = 1 + 0.12 * Math.sin(frameTick * 0.18) + 0.06 * Math.sin(frameTick * 0.37);
        r   *= flicker;
        eff *= (0.9 + 0.1 * flicker);
      }
      const grad = lightingCtx.createRadialGradient(sx, sy, 0, sx, sy, r);
      grad.addColorStop(0,   `rgba(0,0,0,${eff})`);
      grad.addColorStop(0.5, `rgba(0,0,0,${eff * 0.5})`);
      grad.addColorStop(1,   'rgba(0,0,0,0)');
      lightingCtx.fillStyle = grad;
      lightingCtx.beginPath();
      lightingCtx.arc(sx, sy, r, 0, Math.PI * 2);
      lightingCtx.fill();
    }
    lightingCtx.restore();
  }

  // --- Pass 2: colored tint halos (source-over, very low alpha) ---
  // Only fires at dawn/dusk/night to add warmth without washing out day scenes
  if (todIdx > 0) {
    lightingCtx.save();
    lightingCtx.globalCompositeOperation = 'source-over';
    for (const src of lc.lights) {
      const sx  = src.x - (worldCamX || 0);
      const sy  = src.y;
      let r     = src.radius * 0.7;
      if (src._flicker) r *= (1 + 0.08 * Math.sin(frameTick * 0.22));
      // Parse color to rgba with low alpha tint
      const tintAlpha = src.intensity * 0.08;
      const grad = lightingCtx.createRadialGradient(sx, sy, 0, sx, sy, r);
      grad.addColorStop(0,   hexToRgba(src.color, tintAlpha));
      grad.addColorStop(1,   hexToRgba(src.color, 0));
      lightingCtx.fillStyle = grad;
      lightingCtx.beginPath();
      lightingCtx.arc(sx, sy, r, 0, Math.PI * 2);
      lightingCtx.fill();
    }
    lightingCtx.restore();
  }
}

// Minimap: monochrome overlay with real-time player position
function updateMinimap() {
  const mc = document.getElementById('minimapCanvas');
  if (!mc) return;
  const ctx = mc.getContext('2d');
  const W = 200, H = 120;

  // Room layout — architectural floor plan (rooms touch, shared walls)
  const ROOMS = {
    // GROUND FLOOR — y: 92 to 108
    garden:   { x:2,   y:92, w:44, h:16 },
    living:   { x:46,  y:92, w:68, h:16 },
    studio:   { x:114, y:92, w:32, h:16 },
    gym:      { x:146, y:92, w:52, h:16 },
    // UPPER FLOOR — y: 60 to 76
    bathroom: { x:52,  y:60, w:24, h:16 },
    bedroom:  { x:76,  y:60, w:36, h:16 },
    office:   { x:112, y:60, w:36, h:16 },
    // ROOFTOP — y: 28 to 44
    rooftop:  { x:108, y:28, w:50, h:16 },
  };

  // Clear
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#07080a';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = '#2a2a2a';
  ctx.font = '5px monospace';
  ctx.fillText('FLOOR PLAN', 4, 10);

  // Floor divider lines
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, 52); ctx.lineTo(W, 52); // Below rooftop
  ctx.moveTo(0, 84); ctx.lineTo(W, 84); // Below upper floor
  ctx.stroke();

  // Draw rooms with fills and walls
  for (const [id, r] of Object.entries(ROOMS)) {
    const active = id === activeRoomId;

    // Room fill
    ctx.fillStyle = active ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.04)';
    ctx.fillRect(r.x, r.y, r.w, r.h);

    // Walls (outline)
    ctx.strokeStyle = active ? '#ffffff' : '#d0d0d0';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    // Room label
    ctx.fillStyle = active ? '#aaa' : '#666';
    ctx.font = '5px monospace';
    ctx.textAlign = 'center';
    const labelMap = {
      garden:'GARDEN', living:'LIVING', studio:'STUDIO', gym:'GYM',
      bathroom:'BATH', bedroom:'BED', office:'OFFICE', rooftop:'ROOF'
    };
    ctx.fillText(labelMap[id] || id.toUpperCase(), r.x + r.w/2, r.y + r.h/2 + 2);
    ctx.textAlign = 'left';
  }

  // Door symbols — gaps + arcs at shared walls
  const drawDoor = (wx, wy, isVertical) => {
    // Gap in wall
    ctx.fillStyle = '#07080a';
    if (isVertical) ctx.fillRect(wx - _cp(1), wy, 3, 6);
    else ctx.fillRect(wx, wy - _cp(1), 6, 3);
    // Arc showing door swing
    ctx.beginPath();
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 0.5;
    if (isVertical) ctx.arc(wx, wy, 6, 0, Math.PI/2);
    else ctx.arc(wx, wy, 6, -Math.PI/2, 0);
    ctx.stroke();
  };

  // Place doors at shared walls
  drawDoor(46, 96, true);   // Garden/Living
  drawDoor(114, 96, true);  // Living/Studio
  drawDoor(146, 96, true);  // Studio/Gym
  drawDoor(76, 64, true);   // Bathroom/Bedroom
  drawDoor(112, 64, true);  // Bedroom/Office

  // Staircase symbols
  const drawStairs = (sx, sy) => {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 0.5;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(sx, sy + i*2);
      ctx.lineTo(sx + 6, sy + i*2);
      ctx.stroke();
    }
    ctx.fillStyle = '#333';
    ctx.font = '6px monospace';
    ctx.fillText('▲', sx+1, sy-1);
  };

  drawStairs(100, 96);  // Living (to bedroom above)
  drawStairs(120, 93);  // Studio (to rooftop)
  drawStairs(78, 64);   // Bedroom (to living below)

  // Vertical connector lines (dashed, between floors)
  ctx.strokeStyle = '#1e1e1e';
  ctx.lineWidth = 1;
  ctx.setLineDash([1,2]);
  // Living → Bedroom
  ctx.beginPath(); ctx.moveTo(103, 76); ctx.lineTo(93, 92); ctx.stroke();
  // Studio → Rooftop
  ctx.beginPath(); ctx.moveTo(130, 44); ctx.lineTo(130, 60); ctx.stroke();
  ctx.setLineDash([]);

  // Corner brackets
  const B = 6;
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  // TL
  ctx.beginPath(); ctx.moveTo(0,B); ctx.lineTo(0,0); ctx.lineTo(B,0); ctx.stroke();
  // TR
  ctx.beginPath(); ctx.moveTo(W-B,0); ctx.lineTo(W,0); ctx.lineTo(W,B); ctx.stroke();
  // BL
  ctx.beginPath(); ctx.moveTo(0,H-B); ctx.lineTo(0,H); ctx.lineTo(B,H); ctx.stroke();
  // BR
  ctx.beginPath(); ctx.moveTo(W-B,H); ctx.lineTo(W,H); ctx.lineTo(W,H-B); ctx.stroke();

  // Player dot
  const r = ROOMS[activeRoomId];
  const room = rooms[activeRoomId];
  if (r && room && playerChar) {
    const dotX = r.x + (playerChar.x / room.W) * r.w;
    const dotY = r.y + (playerChar.y / room.H) * r.h;
    // Glow
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(dotX - 2, dotY - 2, 5, 5);
    // Dot
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(dotX - _cp(1), dotY - _cp(1), 2, 2);
  }
}

function renderWorld() {
  const cv = document.getElementById('world-canvas');
  if (!cv) return;
  const viewCtx = cv.getContext('2d');
  viewCtx.imageSmoothingEnabled = false;
  viewCtx.clearRect(0, 0, VIEW_W, VIEW_H);

  if (worldTransition.active) {
    worldTransition.progress += 1 / worldTransition.duration;
    if (worldTransition.progress >= 1) {
      worldTransition.progress = 1;
      activeRoomId = worldTransition.toId;
      worldTransition.active = false;
    }
    const p = worldTransition.progress;
    const eased = 1 - (1 - p) * (1 - p); // ease-out
    renderRoomToBuffer(worldTransition.fromId, worldCtx);
    renderRoomToBuffer(worldTransition.toId,   worldCtxB);

    // Crossfade transition
    viewCtx.drawImage(worldOffscreenB, 0, 0);
    viewCtx.globalAlpha = 1 - eased;
    viewCtx.drawImage(worldOffscreen, 0, 0);
    viewCtx.globalAlpha = 1;
  } else {
    renderRoomToBuffer(activeRoomId, worldCtx);
    viewCtx.drawImage(worldOffscreen, 0,0,VIEW_W,VIEW_H, 0,0,VIEW_W,VIEW_H);
  }
}

function animTick(t) {
  requestAnimationFrame(animTick);
  if (!lastMoveTick) { lastMoveTick = t; lastAnimTick = t; }
  _frameTick++;

  // Movement + render at ~20fps
  if (t - lastMoveTick >= MOVE_INTERVAL) {
    lastMoveTick = t;
    tickWorldNPCs();
    tickPlayer();
    tickCamera();
    tickParticles();
    renderWorld();
    updateMinimap();
    updateLighting(_frameTick);
    // Count NPCs in active room without filter()
    let c = 0;
    for (const npc of worldNPCs) {
      if (npc.roomId === activeRoomId) c++;
    }
    const el = document.getElementById('hud-npc-count');
    if (el) el.textContent = c + ' character' + (c===1?'':'s');
    const rl = document.getElementById('hud-room-label');
    if (rl) rl.textContent = (rooms[activeRoomId]?.label||'').toUpperCase();
  }

  // Sprite frame advance at 7fps
  if (t - lastAnimTick >= ANIM_INTERVAL) {
    lastAnimTick = t;
    const isMoving = playerChar.keys && (
      playerChar.keys.left || playerChar.keys.right ||
      playerChar.keys.up   || playerChar.keys.down  ||
      playerChar.clickTarget !== null
    );
    if (isMoving) {
      currentFrame = (currentFrame + 1) & 3;
    } else {
      currentFrame = 1; // neutral standing pose — arms at sides, weight even
    }
  }
}

// Keyboard event listeners
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp'    || e.key === 'w') { playerChar.keys.up    = true; playerChar.clickTarget = null; }
  if (e.key === 'ArrowDown'  || e.key === 's') { playerChar.keys.down  = true; playerChar.clickTarget = null; }
  if (e.key === 'ArrowLeft'  || e.key === 'a') { playerChar.keys.left  = true; playerChar.clickTarget = null; }
  if (e.key === 'ArrowRight' || e.key === 'd') { playerChar.keys.right = true; playerChar.clickTarget = null; }
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp'    || e.key === 'w') playerChar.keys.up    = false;
  if (e.key === 'ArrowDown'  || e.key === 's') playerChar.keys.down  = false;
  if (e.key === 'ArrowLeft'  || e.key === 'a') playerChar.keys.left  = false;
  if (e.key === 'ArrowRight' || e.key === 'd') playerChar.keys.right = false;
});

// Click / tap to move
const worldCanvas = document.getElementById('world-canvas');
const lightingCanvas = document.getElementById('lighting-canvas');
const lightingCtx = lightingCanvas.getContext('2d');
if (worldCanvas) {
  worldCanvas.addEventListener('click', e => {
    const rect = worldCanvas.getBoundingClientRect();
    const scaleX = 480 / rect.width;
    const scaleY = 270 / rect.height;
    const canvasX = (e.clientX - rect.left) * scaleX;
    const canvasY = (e.clientY - rect.top)  * scaleY;
    playerChar.clickTarget = {
      x: Math.round(canvasX + worldCamX),
      y: Math.round(canvasY)
    };
    playerChar.keys = { up: false, down: false, left: false, right: false };
  });
  worldCanvas.addEventListener('touchend', e => {
    if (e.changedTouches.length === 0) return;
    const touch = e.changedTouches[0];
    const rect = worldCanvas.getBoundingClientRect();
    const scaleX = 480 / rect.width;
    const scaleY = 270 / rect.height;
    const canvasX = (touch.clientX - rect.left) * scaleX;
    const canvasY = (touch.clientY - rect.top)  * scaleY;
    playerChar.clickTarget = {
      x: Math.round(canvasX + worldCamX),
      y: Math.round(canvasY)
    };
    playerChar.keys = { up: false, down: false, left: false, right: false };
  });
}

// Initialize body background
syncBodyBackground(activeRoomId);

requestAnimationFrame(animTick);
// Attempt programmatic landscape lock (works on Android + fullscreen)
if (screen.orientation?.lock) screen.orientation.lock('landscape-primary').catch(()=>{});
</script>
