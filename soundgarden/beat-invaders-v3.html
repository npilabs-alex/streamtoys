<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Beat Invaders — FLYER by BandLab</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#010101;overflow:hidden;height:100vh;-webkit-user-select:none;user-select:none}
#header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 24px;font-size:13px;font-family:'Space Grotesk',sans-serif;background:linear-gradient(180deg,rgba(1,1,1,.9),transparent);pointer-events:auto}
#header .wm{font-weight:700;color:#fff;letter-spacing:-.5px}
#header .wm span{color:#f12c18}
#header a{color:#29dbe5;text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:12px}
#header a:hover{color:#fcc931}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;object-fit:contain;image-rendering:pixelated}
#ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;color:#fff;cursor:pointer;background:rgba(1,1,1,.85)}
#ov.hide{display:none}
#ov h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(32px,8vw,52px);font-weight:700;letter-spacing:-1px;margin-bottom:6px;background:linear-gradient(135deg,#f12c18,#b400ff,#29dbe5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#ov .sub{font-size:13px;color:#888;margin-bottom:28px}
#ov .fs{font-size:24px;color:#fcc931;margin-bottom:10px}
#ov .st{font-size:12px;color:#777;line-height:2;margin-bottom:18px;text-align:center}
#ov .st b{color:#29dbe5}
#ov .pr{font-size:13px;color:#29dbe5;animation:p 1.5s infinite}
#ov .br{display:flex;gap:12px;margin-top:14px}
#ov button,#ov .lb{font-family:'JetBrains Mono',monospace;font-size:13px;padding:10px 20px;border:1px solid #29dbe5;background:transparent;color:#29dbe5;cursor:pointer;text-decoration:none;display:inline-block;transition:all .2s}
#ov button:hover,#ov .lb:hover{background:#29dbe5;color:#010101}
@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>
<div id="header"><div class="wm">FLYER <span>by BandLab</span></div><a href="flyer-app.html">Back to wall</a></div>
<canvas id="c"></canvas>
<div id="ov">
  <h1>BEAT INVADERS</h1>
  <div class="sub">A FLYER arcade experience</div>
  <div class="pr">Press SPACE or tap to start</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),ov=document.getElementById('ov');
const W=480,H=700;
canvas.width=W;canvas.height=H;

// Brand
const RED='#f12c18',CYAN='#29dbe5',PURP='#b400ff',YEL='#fcc931',GRN='#00c37d';
const NOTES=['\u266A','\u266B','\u266C','\uD834\uDD1E','\u2669'];
const NCOL=[RED,CYAN,PURP,YEL,GRN,'#ff69b4','#00ff88'];

// Audio
let ac;
function ia(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)()}
function tone(f,ef,d,t='square',v=.12){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(ef,ac.currentTime+d);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
function sfxPew(){tone(880,220,.08,'square',.1)}
function sfxExpl(){if(!ac)return;const b=ac.createBufferSource(),buf=ac.createBuffer(1,ac.sampleRate*.12|0,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);b.buffer=buf;const g=ac.createGain();g.gain.setValueAtTime(.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);b.connect(g);g.connect(ac.destination);b.start()}
function sfxBoss(){tone(200,60,.15,'sawtooth',.14)}
function sfxPow(){const t=ac.currentTime;[440,554,659].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.1,t+i*.06);g.gain.exponentialRampToValueAtTime(.001,t+i*.06+.2);o.connect(g);g.connect(ac.destination);o.start(t+i*.06);o.stop(t+i*.06+.2)})}
function sfxDrop(){tone(150,20,.8,'sine',.35)}
function sfxHit(){if(!ac)return;const b=ac.createBufferSource(),buf=ac.createBuffer(1,ac.sampleRate*.08|0,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)*.7;b.buffer=buf;const g=ac.createGain();g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.08);b.connect(g);g.connect(ac.destination);b.start()}
function sfxKick(){tone(160,40,.12,'sine',.2)}

// State
let state='start',score,lives,wave,player,bullets,eBullets,invaders,invDir,invSpeed,invMoveT;
let invShootT,particles,stars,powerups,floats,combo,comboT,maxCombo,kills,shots,shakeDur,shakeAmt;
let boss,bossT,swoopQ,swoopT,bgHue,waveBannerT,waveBannerTxt,beatT,beatInterval,lastTime;

// Stars
function mkStars(){stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+.5,sp:Math.random()*40+15})}
mkStars();

function initGame(){
  score=0;lives=3;wave=0;kills=0;shots=0;maxCombo=0;combo=0;comboT=0;
  shakeDur=0;shakeAmt=0;bgHue=220;beatT=0;beatInterval=30;lastTime=0;
  player={x:W/2,y:H-50,w:36,h:24,speed:4,shield:0,triple:0,speedT:0,iframes:0};
  bullets=[];eBullets=[];invaders=[];particles=[];powerups=[];floats=[];
  swoopQ=[];swoopT=0;boss=null;bossT=0;waveBannerT=0;waveBannerTxt='';
  ov.classList.add('hide');
  nextWave();
}

function nextWave(){
  wave++;bgHue=(220+wave*25)%360;
  waveBannerTxt=wave%3===0?'BOSS WAVE '+wave:'WAVE '+wave;
  waveBannerT=90;state='wave';
  invaders=[];eBullets=[];swoopQ=[];boss=null;
  if(wave%3===0){setupBoss();return}
  const rows=Math.min(5+Math.floor((wave-1)/2),8);
  const cols=8;invDir=1;invSpeed=.4+wave*.08;invMoveT=0;invShootT=0;
  const offX=(W-cols*(30+8))/2+15;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    invaders.push({x:offX+c*38,y:60+r*34,w:28,h:24,hp:1,row:r,col:c,
      sym:NOTES[r%NOTES.length],color:NCOL[r%NCOL.length],baseX:offX+c*38,baseY:60+r*34,
      swooping:false,swoopPath:null,swoopI:0})
  }
  beatInterval=Math.max(8,30-wave*2);
}

function setupBoss(){
  state='wave';
  const shapes=['GUITAR','DRUMS','KEYS'];
  boss={x:W/2,y:80,w:80,h:50,maxHp:20+wave*5,hp:20+wave*5,phase:0,shootT:0,
    name:shapes[(wave/3-1)%3],color:PURP,t:0};
}

// Input
const keys={};
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault()});
document.addEventListener('keyup',e=>{keys[e.code]=false});
let touchL=false,touchR=false,touchF=false;
canvas.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){const r=t.clientX/window.innerWidth;if(r<.33)touchL=true;else if(r>.66)touchR=true;else touchF=true}},{passive:false});
canvas.addEventListener('touchend',e=>{for(const t of e.changedTouches){const r=t.clientX/window.innerWidth;if(r<.33)touchL=false;else if(r>.66)touchR=false;else touchF=false}});
function startHandler(){if(state==='start'||state==='over'){ia();initGame()}}
ov.addEventListener('click',startHandler);
ov.addEventListener('touchend',e=>{e.preventDefault();startHandler()});
document.addEventListener('keydown',e=>{if((state==='start'||state==='over')&&e.code==='Space'){ia();initGame()}});

let fireCD=0;
function handleInput(dt){
  const sp=player.speedT>0?6:player.speed;
  if(keys['ArrowLeft']||keys['KeyA']||touchL)player.x-=sp*dt*60;
  if(keys['ArrowRight']||keys['KeyD']||touchR)player.x+=sp*dt*60;
  player.x=Math.max(player.w/2,Math.min(W-player.w/2,player.x));
  fireCD-=dt;
  if((keys['Space']||touchF)&&fireCD<=0){
    fireCD=.18;shots++;sfxPew();
    if(player.triple>0){
      bullets.push({x:player.x-8,y:player.y-14,vx:-1.5,vy:-7});
      bullets.push({x:player.x,y:player.y-14,vx:0,vy:-7});
      bullets.push({x:player.x+8,y:player.y-14,vx:1.5,vy:-7});
    }else bullets.push({x:player.x,y:player.y-14,vx:0,vy:-7});
  }
}

// Particles
function burst(x,y,col,n=18){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=Math.random()*3+1;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.5,life:1,size:Math.random()*3+1,color:col})}}

function addFloat(x,y,txt,col,sz=16){floats.push({x,y,txt,col,size:sz,life:1})}

function dropPow(x,y){
  const r=Math.random();if(r>.15)return;
  const t=Math.random()<.08?3:Math.random()<.33?0:Math.random()<.5?1:2;
  const cols=[CYAN,YEL,GRN,RED];const icons=['\u25C6','\u2726','\u26A1','\u2738'];
  powerups.push({x,y,type:t,vy:1.5,color:cols[t],icon:icons[t]});
}

function applyPow(t){
  sfxPow();
  if(t===0){player.shield=1;addFloat(player.x,player.y-20,'SHIELD!',CYAN,20)}
  if(t===1){player.triple=480;addFloat(player.x,player.y-20,'TRIPLE!',YEL,20)}
  if(t===2){player.speedT=600;addFloat(player.x,player.y-20,'SPEED!',GRN,20)}
  if(t===3){invaders.forEach(inv=>{burst(inv.x,inv.y,inv.color);score+=10});invaders=[];addFloat(W/2,H/2,'CLEARED!',RED,28)}
}

function hitCombo(x,y,pts){
  if(comboT>0)combo++;else combo=1;
  comboT=60;const mult=combo>=8?8:combo>=4?4:combo>=2?2:1;
  if(combo>maxCombo)maxCombo=combo;
  const gain=pts*mult;score+=gain;
  if(mult>1)addFloat(x,y-20,mult+'x',mult>=8?RED:mult>=4?YEL:CYAN,12+mult*2);
}

// Update
function update(dt){
  beatT-=dt*60;if(beatT<=0){beatT=beatInterval;sfxKick()}
  // Timers
  if(player.triple>0)player.triple-=dt*60;
  if(player.speedT>0)player.speedT-=dt*60;
  if(player.iframes>0)player.iframes-=dt*60;
  if(comboT>0)comboT-=dt*60;else combo=0;
  if(shakeDur>0)shakeDur-=dt*60;

  handleInput(dt);

  // Bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx*dt*60;b.y+=b.vy*dt*60;
    if(b.y<-10||b.x<-10||b.x>W+10)bullets.splice(i,1);
  }

  // Boss
  if(boss){updateBoss(dt);return}

  // Invader movement
  invMoveT+=dt*60;
  if(invMoveT>=Math.max(2,12-wave)){
    invMoveT=0;let edgeHit=false;
    invaders.filter(v=>!v.swooping).forEach(inv=>{
      inv.x+=invDir*10*invSpeed;
      if(inv.x<20||inv.x>W-20)edgeHit=true;
    });
    if(edgeHit){invDir*=-1;invaders.filter(v=>!v.swooping).forEach(inv=>inv.y+=12)}
  }

  // Invader shooting
  invShootT+=dt*60;const shootRate=Math.max(15,50-wave*4);
  if(invShootT>=shootRate&&invaders.length>0){
    invShootT=0;const inv=invaders[Math.random()*invaders.length|0];
    if(inv)eBullets.push({x:inv.x,y:inv.y+12,vy:3+wave*.3});
  }

  // Swooping (wave 3+)
  swoopT+=dt*60;
  if(wave>=3&&swoopT>120&&invaders.length>3&&Math.random()<.02*dt*60){
    swoopT=0;const pool=invaders.filter(v=>!v.swooping);
    if(pool.length>0){const inv=pool[Math.random()*pool.length|0];
      inv.swooping=true;inv.swoopPath=mkSwoop(inv.x,inv.y,player.x);inv.swoopI=0}
  }
  invaders.filter(v=>v.swooping).forEach(inv=>{
    inv.swoopI+=dt*60*3;const p=inv.swoopPath;
    if(inv.swoopI>=p.length){inv.swooping=false;inv.x=inv.baseX;inv.y=inv.baseY}
    else{const pt=p[Math.min(inv.swoopI|0,p.length-1)];inv.x=pt.x;inv.y=pt.y}
  });

  // Bullet-invader collision
  for(let bi=bullets.length-1;bi>=0;bi--){
    const b=bullets[bi];
    for(let ii=invaders.length-1;ii>=0;ii--){
      const inv=invaders[ii];
      if(Math.abs(b.x-inv.x)<14&&Math.abs(b.y-inv.y)<13){
        bullets.splice(bi,1);inv.hp--;kills++;
        if(inv.hp<=0){burst(inv.x,inv.y,inv.color);sfxExpl();hitCombo(inv.x,inv.y,10);dropPow(inv.x,inv.y);invaders.splice(ii,1);
          beatInterval=Math.max(5,8+invaders.length/3|0);
        }break;
      }
    }
  }

  // Enemy bullets
  for(let i=eBullets.length-1;i>=0;i--){
    const b=eBullets[i];b.y+=b.vy*dt*60;
    if(b.y>H+10){eBullets.splice(i,1);continue}
    if(player.iframes<=0&&Math.abs(b.x-player.x)<16&&Math.abs(b.y-player.y)<12){
      eBullets.splice(i,1);playerHit();
    }
  }

  // Invader-player collision
  if(player.iframes<=0)invaders.forEach(inv=>{
    if(Math.abs(inv.x-player.x)<20&&Math.abs(inv.y-player.y)<18)playerHit();
  });

  // Powerups
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];p.y+=p.vy*dt*60;
    if(p.y>H+10){powerups.splice(i,1);continue}
    if(Math.abs(p.x-player.x)<20&&Math.abs(p.y-player.y)<16){applyPow(p.type);powerups.splice(i,1)}
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.05*dt*60;p.life-=dt*2;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){floats[i].y-=dt*40;floats[i].life-=dt*1.5;if(floats[i].life<=0)floats.splice(i,1)}

  // Wave clear
  if(invaders.length===0&&!boss)nextWave();
}

function mkSwoop(sx,sy,px){
  const pts=[];const steps=80;
  for(let i=0;i<steps;i++){
    const t=i/steps;
    const x=sx+Math.sin(t*Math.PI*2)*60+(px-sx)*Math.sin(t*Math.PI);
    const y=sy+t*(H+40-sy);pts.push({x,y});
  }
  return pts;
}

function updateBoss(dt){
  boss.t+=dt*60;boss.x=W/2+Math.sin(boss.t*.03)*150;boss.y=70+Math.sin(boss.t*.02)*30;
  boss.shootT+=dt*60;const rate=Math.max(20,50-wave*3);
  if(boss.shootT>=rate){
    boss.shootT=0;
    for(let i=-2;i<=2;i++)eBullets.push({x:boss.x+i*14,y:boss.y+boss.h/2,vy:3+Math.abs(i)*.3});
  }
  // Bullet-boss collision
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(Math.abs(b.x-boss.x)<boss.w/2&&Math.abs(b.y-boss.y)<boss.h/2){
      bullets.splice(i,1);boss.hp--;sfxBoss();
      burst(b.x,b.y,boss.color,6);hitCombo(b.x,b.y,5);
      if(boss.hp<=0){burst(boss.x,boss.y,PURP,40);burst(boss.x,boss.y,CYAN,30);
        shakeDur=20;shakeAmt=8;score+=500;addFloat(boss.x,boss.y-30,'+500',YEL,28);
        sfxExpl();boss=null;nextWave();return}
    }
  }
  // Enemy bullets
  for(let i=eBullets.length-1;i>=0;i--){
    const b=eBullets[i];b.y+=b.vy*dt*60;
    if(b.y>H+10){eBullets.splice(i,1);continue}
    if(player.iframes<=0&&Math.abs(b.x-player.x)<16&&Math.abs(b.y-player.y)<12){eBullets.splice(i,1);playerHit()}
  }
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.05*dt*60;p.life-=dt*2;if(p.life<=0)particles.splice(i,1)}
  for(let i=floats.length-1;i>=0;i--){floats[i].y-=dt*40;floats[i].life-=dt*1.5;if(floats[i].life<=0)floats.splice(i,1)}
  for(let i=powerups.length-1;i>=0;i--){const p=powerups[i];p.y+=p.vy*dt*60;if(p.y>H+10){powerups.splice(i,1);continue}if(Math.abs(p.x-player.x)<20&&Math.abs(p.y-player.y)<16){applyPow(p.type);powerups.splice(i,1)}}
}

function playerHit(){
  if(player.shield>0){player.shield=0;shakeDur=6;shakeAmt=3;sfxHit();burst(player.x,player.y,CYAN,10);return}
  lives--;shakeDur=12;shakeAmt=6;sfxHit();burst(player.x,player.y,RED,20);player.iframes=90;
  if(lives<=0){state='over';sfxDrop();showOver()}
}

function showOver(){
  const acc=shots>0?((kills/shots)*100).toFixed(1):0;
  ov.innerHTML=`<h1>GAME OVER</h1><div class="fs">SCORE: ${score}</div><div class="st">Kills: <b>${kills}</b><br>Accuracy: <b>${acc}%</b><br>Max Combo: <b>${maxCombo}x</b><br>Waves: <b>${wave}</b></div><div class="br"><button onclick="ia();initGame()">Play Again</button><a class="lb" href="flyer-app.html">Back to wall</a></div>`;
  ov.classList.remove('hide');
}

// Draw
function draw(){
  ctx.fillStyle='#010101';ctx.fillRect(0,0,W,H);
  // Stars
  stars.forEach(s=>{s.y+=s.sp*(1/60);if(s.y>H){s.y=0;s.x=Math.random()*W}ctx.fillStyle=`rgba(255,255,255,${s.s/2})`;ctx.fillRect(s.x,s.y,s.s,s.s)});

  // Subtle bg glow
  const grad=ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,350);
  grad.addColorStop(0,`hsla(${bgHue},60%,8%,.3)`);grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  if(state==='wave'){
    // Draw wave banner
    waveBannerT--;
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font="bold 48px 'Space Grotesk',sans-serif";
    ctx.shadowColor=PURP;ctx.shadowBlur=30;ctx.fillStyle='#fff';
    ctx.globalAlpha=Math.min(1,waveBannerT/20);
    ctx.fillText(waveBannerTxt,W/2,H/2);ctx.restore();
    if(waveBannerT<=0)state='play';
    return;
  }

  const sx=shakeDur>0?(Math.random()-.5)*shakeAmt:0;
  const sy=shakeDur>0?(Math.random()-.5)*shakeAmt:0;
  ctx.save();ctx.translate(sx,sy);

  // Player
  if(player.iframes<=0||Math.floor(player.iframes)%4<2){
    ctx.save();ctx.translate(player.x,player.y);
    // Speed afterimages
    if(player.speedT>0){ctx.globalAlpha=.15;ctx.fillStyle=GRN;for(let i=1;i<=3;i++){drawShip(i*(invDir||1)*-4,0)}}
    ctx.globalAlpha=1;drawShip(0,0);
    // Shield
    if(player.shield>0){ctx.strokeStyle=CYAN;ctx.shadowColor=CYAN;ctx.shadowBlur=15;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}
    ctx.restore();
  }

  // Bullets (sine wave glow)
  bullets.forEach(b=>{
    ctx.save();ctx.shadowColor=CYAN;ctx.shadowBlur=8;ctx.strokeStyle=CYAN;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+Math.sin(b.y*.3)*3,b.y+6);ctx.stroke();
    ctx.restore();
  });

  // Enemy bullets
  eBullets.forEach(b=>{
    ctx.save();ctx.shadowColor=RED;ctx.shadowBlur=6;ctx.fillStyle=RED;
    ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();ctx.restore();
  });

  // Invaders
  invaders.forEach(inv=>{
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 22px sans-serif';ctx.shadowColor=inv.color;ctx.shadowBlur=12;
    ctx.fillStyle=inv.color;ctx.fillText(inv.sym,inv.x,inv.y);ctx.restore();
  });

  // Boss
  if(boss){
    ctx.save();ctx.translate(boss.x,boss.y);
    ctx.shadowColor=boss.color;ctx.shadowBlur=20;
    // Draw boss shape
    ctx.fillStyle=boss.color;ctx.globalAlpha=.8;
    if(boss.name==='GUITAR'){ctx.beginPath();ctx.ellipse(0,0,18,30,0,0,Math.PI*2);ctx.fill();ctx.fillRect(-5,-45,10,30)}
    else if(boss.name==='DRUMS'){ctx.beginPath();ctx.arc(0,0,25,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(-22,-15,12,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(22,-15,12,0,Math.PI*2);ctx.fill()}
    else{ctx.fillRect(-35,-15,70,30);for(let i=-3;i<=3;i++){ctx.fillStyle=i%2?'#222':'#fff';ctx.fillRect(i*10-5,-15,10,30)}}
    ctx.globalAlpha=1;ctx.font="bold 14px 'JetBrains Mono',monospace";ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(boss.name,0,-boss.h/2-10);
    ctx.restore();
    // HP bar
    const bw=100,bh=6,bx=W/2-bw/2,by=18;
    ctx.fillStyle='#333';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=boss.hp/boss.maxHp>.5?GRN:boss.hp/boss.maxHp>.25?YEL:RED;
    ctx.fillRect(bx,by,bw*(boss.hp/boss.maxHp),bh);
  }

  // Powerups
  powerups.forEach(p=>{
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 18px sans-serif';ctx.shadowColor=p.color;ctx.shadowBlur=10;
    ctx.fillStyle=p.color;ctx.fillText(p.icon,p.x,p.y);ctx.restore();
  });

  // Particles
  particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);ctx.globalAlpha=1});

  // Floats
  floats.forEach(f=>{
    ctx.save();ctx.globalAlpha=f.life;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`bold ${f.size}px 'JetBrains Mono',monospace`;ctx.shadowColor=f.col;ctx.shadowBlur=8;
    ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);ctx.restore();
  });

  ctx.restore();// shake

  // HUD
  ctx.save();
  ctx.font="bold 14px 'JetBrains Mono',monospace";
  ctx.fillStyle=YEL;ctx.textAlign='left';ctx.fillText('SCORE: '+score,12,44);
  ctx.fillStyle=PURP;ctx.textAlign='center';ctx.fillText('WAVE '+wave,W/2,44);
  if(combo>=2){ctx.fillStyle=CYAN;ctx.fillText(combo+'x COMBO',W/2,62)}
  ctx.fillStyle=RED;ctx.textAlign='right';
  let hearts='';for(let i=0;i<lives;i++)hearts+='\u2764 ';
  ctx.fillText(hearts,W-12,44);
  // Powerup timers
  let ty=62;ctx.textAlign='right';ctx.font="11px 'JetBrains Mono',monospace";
  if(player.triple>0){ctx.fillStyle=YEL;ctx.fillText('TRIPLE '+(player.triple/60|0)+'s',W-12,ty);ty+=14}
  if(player.speedT>0){ctx.fillStyle=GRN;ctx.fillText('SPEED '+(player.speedT/60|0)+'s',W-12,ty);ty+=14}
  if(player.shield>0){ctx.fillStyle=CYAN;ctx.fillText('SHIELD',W-12,ty)}
  ctx.restore();
}

function drawShip(ox,oy){
  // Speaker/amp shape
  ctx.fillStyle='#ddd';
  ctx.beginPath();ctx.moveTo(ox,oy-12);ctx.lineTo(ox-16,oy+10);ctx.lineTo(ox+16,oy+10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#888';ctx.beginPath();ctx.arc(ox,oy+2,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#444';ctx.beginPath();ctx.arc(ox,oy+2,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=CYAN;ctx.shadowColor=CYAN;ctx.shadowBlur=6;
  ctx.fillRect(ox-1,oy-14,2,5);ctx.shadowBlur=0;
}

// Expose for inline handlers
window.ia=ia;window.initGame=initGame;

// Loop
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTime)lastTime=ts;
  const dt=Math.min((ts-lastTime)/1000,.05);lastTime=ts;
  if(state==='play'||state==='wave')update(dt);
  if(state!=='start'&&state!=='over')draw();
}
requestAnimationFrame(loop);
</script>
